"AVISO A LOS USUARIOS.\nPor disposición del H. Ayuntamiento y de la Hermandad del Santo Despertar, las corridas quedan SUSPENDIDAS hasta nuevo aviso. No se venderán boletos de salida.\nDios nos cuide.\n— Sahuayo, 24 de julio.\n\n(abajo, con pluma, letra distinta:)\nEl de las 5:40 sí salió. Yo lo vi irse vacío. —R.": "利用者各位。\n市議会および聖なる目覚めの兄弟団の決定により、全便は追って通知があるまで運休とします。出発の切符は販売しません。\n神よ我らを守りたまえ。\n— サウアヨ、七月二十四日。\n\n（下に、ペンで、別の筆跡：）\n五時四十分の便は出た。空のまま出ていくのを見た。—R",
"TESORERÍA MUNICIPAL · RECIBO 00417\nConcepto: donativo voluntario \"Procesión de Desagravio\".\nRecibí de: Hermandad del Santo Despertar.\nCantidad: $48,000.00 (cuarenta y ocho mil pesos). Efectivo.\nObservaciones: \"para veladoras y cencerros\".\n\n(con lápiz:) ¿Quién necesita 48 mil pesos de cencerros?": "市出納課 · 領収書 00417\n名目：任意の寄付「償いの行列」。\n受領先：聖なる目覚めの兄弟団。\n金額：48,000.00ペソ（四万八千ペソ）。現金。\n備考：「ろうそくとカウベル代」。\n\n（鉛筆で：）四万八千ペソ分のカウベルなんて誰がいるんだ？",
"DIRECCIÓN DE SEGURIDAD PÚBLICA · PARTE DE NOVEDADES · 12 DE JULIO\n\n22:40 — Reporte de persona agresiva en calle Insurgentes esq. Juárez. Masculino 40 años aprox., camisa de cuadros, \"haciendo ruidos\". Al llegar la unidad 03 el sujeto corrió en cuatro patas (sic). No se logró detención. Vecinos lo identifican como Salvador \"Chava\" Orozco.\n\n23:15 — Vecinos de la col. Santuario reportan campanas del Sagrado Corazón sonando sin personal en el templo. Se verifica: templo cerrado con candado por fuera. Las campanas continuaban.\n\n23:50 — Doña E. (La Vidente) y 30 personas con túnicas en la escalinata de Cristo Rey, subiendo de rodillas. No constituye falta. Se retira la unidad.\n\nOBSERVACIÓN DEL COMANDANTE: Es la quinta noche. Pido instrucciones por escrito. Mis elementos no quieren cubrir el turno de noche. Yo tampoco.\n— Cmte. J. Navarro": "公安課 · 事件報告 · 七月十二日\n\n22:40 — インスルヘンテス通りとフアレス通りの角で暴れる人物の通報。男性、四十歳前後、チェックのシャツ、「うなり声をあげている」。三号車が到着すると、当人は四つん這いで走り去った（原文ママ）。逮捕に至らず。近隣住民はサルバドール・「チャバ」・オロスコと証言。\n\n23:15 — サントゥアリオ地区の住民から、無人のサグラド・コラソン教会の鐘が鳴っているとの通報。確認：教会は外側から南京錠で施錠。鐘は鳴り続けていた。\n\n23:50 — E夫人（お告げの女）と三十名がローブ姿でクリスト・レイの階段を膝で登っていた。違反には当たらず。撤収。\n\n隊長所見：これで五晩目。文書での指示を求む。部下は夜勤を嫌がっている。私もだ。\n— J・ナバロ隊長",
"SESIÓN EXTRAORDINARIA DE CABILDO · 18 DE JULIO\nÚnico punto: Festival de las Fiestas de Santiago Apóstol.\n\nEl regidor de Cultura expone que el Festival (escenario en la plaza, 4 noches, patrocinio cervecero) es \"lo que trae gente y dinero\". La regidora de Educación expone que \"la fiesta ya no es de Santiago, es del DJ\", y lee una carta de 412 firmas de la Hermandad del Santo Despertar que exige cancelar.\n\nSe somete a votación: 7 votos a favor de CANCELAR el Festival, 2 en contra.\n\nSe autoriza en su lugar una \"Procesión de Desagravio\" el 24 de julio de la plaza a Cristo Rey, organizada por la Hermandad, \"sin bocinas, sin alcohol, con veladoras\".\n\nEl Presidente Municipal pide que conste en acta que vota a favor \"para que ya se calmen\".\n\n(en el margen, a lápiz:) Se calmaron.": "市議会臨時会 · 七月十八日\n議題：聖ヤコブ祭のフェスティバルについて。\n\n文化担当議員は、フェスティバル（広場のステージ、四晩、ビール会社の協賛）は「人と金を呼ぶもの」だと述べる。教育担当議員は「祭りはもう聖ヤコブのものではなくDJのものだ」と述べ、中止を求める聖なる目覚めの兄弟団の四百十二名の署名入り書簡を読み上げる。\n\n採決：フェスティバル中止に賛成七、反対二。\n\n代わりに七月二十四日、広場からクリスト・レイまでの「償いの行列」を兄弟団主催で認める。「スピーカーなし、酒なし、ろうそくのみ」。\n\n市長は「連中が静かになるように」賛成票を投じたと議事録に残すよう求める。\n\n（余白に、鉛筆で：）静かになった。",
"Mari:\nNo te vayas a reír. Llevo dos días durmiendo en la oficina porque en la casa se oyen cencerros toda la noche y en la oficina no. O sea sí, pero menos.\n\nAyer fui a la procesión porque era de ley ir. Yo esperaba rezos. Y había rezos, pero también otra cosa que no era español ni latín. Celso lo leía de un cuaderno. Eduviges se reía. Las veladoras no se apagaban con el aire.\n\nSubieron una vasija de barro, grande, como una tortuga, entre ocho. La pusieron frente al Cristo. Y luego todos gritaron \"despierta\" y yo también grité, Mari, porque todos gritaban, y no sé por qué.\n\nDesde entonces no he dormido. Las campanas no paran. Navarro no contesta la radio. Mandé a los muchachos a cerrar el boulevard con las patrullas y no regresaron.\n\nSi lees esto es que no te llamé. No es que no quisiera. Es que ya no sé qué voy a decir cuando abra la boca.\nTe quiero. No vengas.\n—T.": "マリへ\n笑わないでくれ。二日前から事務所で寝ている。家にいると一晩中カウベルが聞こえて、事務所だと聞こえないからだ。いや、聞こえるが、少しは静かだ。\n\n昨日は行列に出た。出ないわけにはいかなかった。祈りを聞くつもりだった。祈りはあった。だがスペイン語でもラテン語でもない何かもあった。セルソがノートから読み上げていた。エドゥビヘスは笑っていた。ろうそくは風に吹かれても消えなかった。\n\n大きな土の壺を、亀みたいなやつを、八人がかりで運び上げた。キリスト像の前に置いた。それからみんなが「目覚めよ」と叫んで、おれも叫んだ、マリ。みんなが叫んでいたからで、なぜだかわからない。\n\nそれから眠れていない。鐘が止まらない。ナバロは無線に出ない。パトカーで大通りを封鎖させに若い連中を出したが、戻ってこなかった。\n\nこれを読んでいるなら、おれは電話しなかったということだ。したくなかったわけじゃない。口を開いたら何を言うのか、もうわからないんだ。\n愛してる。来るな。\n—T",
"✝ ORACIÓN DEL SANTO DESPERTAR ✝\n(rezar de rodillas, con la veladora en la mano, nueve veces)\n\nDios Padre, que ves a este pueblo dormido en la fiesta y el vicio,\nperdona a Sahuayo, Sodoma de la Ciénega, y corrígelo con tu fuerza.\nQue el que baila, pare. Que el que come, ayune. Que el que grita, calle.\nQue el que se puso máscara, se la quede.\nDespierta, Señor, al que duerme bajo el cerro, y que él los despierte a ellos.\nDESPIERTA, SAHUAYO. Amén.\n\n(a mano:) El Hermano dice que ya está despierto. Que ya no hay que rezar. Que ahora hay que cuidar el rebaño.": "✝ 聖なる目覚めの祈り ✝\n（跪き、ろうそくを手に、九度唱えること）\n\n父なる神よ、祭りと悪徳に眠るこの町を見たまえ。\n湿地のソドム、サウアヨを赦し、御力をもって正したまえ。\n踊る者は止まれ。食う者は断て。叫ぶ者は黙れ。\n仮面をつけた者は、それを外すな。\n主よ、丘の下に眠る者を目覚めさせ、その者に彼らを目覚めさせたまえ。\n目覚めよ、サウアヨ。アーメン。\n\n（手書きで：）兄弟は、もう目覚めたと言う。もう祈る必要はない。これからは群れの世話をするのだと。",
"Para quien venga a cubrir el turno:\nNO le abran al del cuarto 7. Lleva tres días sin salir y pide que le lleven el desayuno \"con la campanita\". No tenemos campanita.\nLa llave de la azotea la tiene él. No sé por qué se la di.\n—Yola": "次のシフトの人へ：\n7号室の客には扉を開けないこと。三日間部屋から出ず、朝食を「小さな鈴と一緒に」持ってこいと言う。うちに鈴なんてない。\n屋上の鍵はあの人が持っている。どうして渡したのか自分でもわからない。\n—ヨラ",
"Receta: Clonazepam 2 mg. Paciente: ——. Médico: Dr. ——.\n\n(al reverso, con plumón:)\nYa no surto. Vinieron tres de la Hermandad a decir que las medicinas \"duermen\". Me quitaron el estante completo.\nSi alguien necesita algo, está debajo del mostrador, en la caja de las vendas.\nQue Dios me perdone por lo que les dije.": "処方箋：クロナゼパム 2 mg。患者：——。医師：——。\n\n（裏に、マーカーで：）\nもう薬は出さない。兄弟団の三人が来て、薬は「人を眠らせる」と言った。棚ごと持っていかれた。\n誰か必要なら、カウンターの下、包帯の箱の中にある。\n奴らに言ったことを、神よ赦したまえ。",
"RITO DEL DESPERTAR\n(copiado de la Vidente, que lo copió del sueño)\nI. Se baja a donde están los que murieron por Cristo Rey y se les pide permiso.\nII. Se cava bajo la tercera cruz hasta hallar el corazón viejo del pueblo. (Hallado el 2 de julio. Es una vasija. Tortuga. Pesa como un hombre.)\nIII. Se sube al cerro con el corazón. Cuarenta veladoras por cada año desde que la fiesta se echó a perder: la Vidente dice que fue en el 85. (Hicimos 1,640. Faltaron.)\nIV. Se llama al Durmiente por su nombre viejo tres veces y por su nombre nuevo tres veces.\nV. Se le ofrece lo que el pueblo más quiere: la fiesta. Las máscaras. La comida. El ruido.\nVI. Cuando despierte, nosotros ya estaremos despiertos y los demás se corregirán.\n\n(otra letra:) Punto VI no está pasando como dijo. Los demás no se corrigieron: se quedaron en lo que estaban haciendo. El Hermano dice que eso ES la corrección. Yo ya no sé.\n\n(otra letra, grande:) NO LE DIGAN SU NOMBRE EN VOZ ALTA. VIENE.": "目覚めの儀式\n（お告げの女より書き写す。彼女は夢より書き写した）\n一、クリスト・レイのために死んだ者たちのもとへ下り、許しを乞う。\n二、第三の十字架の下を掘り、町の古い心臓を見つける。（七月二日に発見。壺である。亀。男一人分の重さ。）\n三、心臓を抱えて丘を登る。祭りが堕落してからの一年ごとに、ろうそく四十本：お告げの女は八五年からだと言う。（千六百四十本作った。足りなかった。）\n四、眠れる者を古い名で三度、新しい名で三度呼ぶ。\n五、町が最も愛するものを捧げる：祭り。仮面。食べ物。騒ぎ。\n六、彼が目覚めるとき、我らはすでに目覚めており、他の者たちは正される。\n\n（別の筆跡：）六は、言われたとおりになっていない。他の者たちは正されなかった：していたことをそのまま続けている。兄弟は、それこそが正しさだと言う。私にはもうわからない。\n\n（別の筆跡、大きく：）あの名を声に出して呼ぶな。来る。",
"Yo nomás quería que dejaran de poner la música tan fuerte en la plaza. Eso era todo. Que mi hijo no llegara borracho el 25. Que el padre no tuviera que gritar la misa encima del sonido.\nSe lo pedí a Dios y me contestó otro. Yo creí que era Él porque hablaba bonito.\nAhora el Hermano dice que yo soy santa y me tiene aquí abajo para que no me vaya.\nSi alguien lee esto: no le recen. No lo llamen. Llámenlos a ellos. Por su nombre. Como cuando uno llama a los hijos a cenar. Eso sí lo oyen.\n—Eduviges Hernández, 71 años. Perdón.": "私はただ、広場であんなに大きな音で音楽をかけるのをやめてほしかっただけ。それだけだった。息子が二十五日に酔って帰ってこないように。神父さまがスピーカーに負けじとミサを叫ばなくてすむように。\n神さまにお願いしたら、別の者が答えた。あんまりきれいな言葉で話すから、あの方だと思ってしまった。\n今、兄弟は私を聖女だと言って、逃げないようにここに閉じ込めている。\nこれを読む人へ：あれに祈らないで。あれを呼ばないで。あの人たちを呼んで。名前で。子どもたちを夕飯に呼ぶみたいに。それなら聞こえる。\n—エドゥビヘス・エルナンデス、七十一歳。ごめんなさい。",
"Cuaderno de pasta dura, letra de cura.\n\nPágina 1. Lo que sé: la cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz. La Hermandad lo llama con campanas. Yo pensé que podía bendecirlo con campanas. Error de viejo.\n\nPágina 2. Lo que vi: los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije \"Lupe\". No \"hija\", no \"mujer\": Lupe. Un segundo. Luego se fue.\n\nPágina 3. Lista: todos los que tú vayas sabiendo. Apúntalos. Los nombres son lo único que no se les olvidó.\n\nPágina 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.": "硬い表紙の手帳、神父の筆跡。\n\n一頁。わかっていること：下にいるあれは悪魔でも聖人でもない。あれは場所だ。あれは名前だ。呼ばれれば目覚め、放っておけば眠る。兄弟団は鐘であれを呼ぶ。私は鐘で祝福できると思った。老人の間違いだ。\n\n二頁。見たこと：取り憑かれた者は自分の名前に反応する。「ルペ」と呼ぶと、ルペは私を振り返った。「娘よ」でも「お前」でもない：ルペ、と。一秒だけ。それから行ってしまった。\n\n三頁。リスト：お前が知った者を全員。書き留めろ。名前だけは、彼らが忘れなかった唯一のものだ。\n\n四頁。皆に聞こえる場所に登れ。鐘を鳴らして呼べ。そして祈るな：名前を呼べ。一人ずつ。彼らが目覚めていることに疲れるまで。",
"HOTEL LATINO · REGISTRO DE HUÉSPEDES · JULIO\n\n19 — Cuarto 3: Sr. Vargas, viajante de huarache. Pagó dos noches.\n21 — Cuarto 7: Rubén Castañeda. \"Es de aquí, pero ya no quiere dormir en su casa\". Pagó una semana. Trae campanitas en una bolsa.\n22 — Cuarto 5: dos muchachos de Jiquilpan que venían al Festival. Se fueron sin pagar cuando les dijeron que se canceló.\n23 — Nadie.\n24 — Nadie. Don Rubén pidió que le subieran el desayuno con la campanita. Yola dijo que no.\n25 — (sin letra; la página está marcada con cera de veladora)": "ホテル・ラティーノ · 宿泊台帳 · 七月\n\n十九日 — 3号室：バルガス氏、ワラチェの行商。二泊分前払い。\n二十一日 — 7号室：ルベン・カスタニェダ。「地元の人だが、もう自宅で寝たくないそうだ」。一週間分前払い。袋に小さな鈴を入れて持ち歩いている。\n二十二日 — 5号室：フェスティバル目当てのヒキルパンの若者二人。中止と聞くと払わずに出ていった。\n二十三日 — なし。\n二十四日 — なし。ルベンさんが朝食を鈴と一緒に持ってこいと言った。ヨラは断った。\n二十五日 — （記入なし。ページにろうそくの蝋の跡）",
"REBAÑO DE CONSTITUCIÓN (a mi cargo)\n- Los dos de la ferretería (hermanos)\n- El muchacho del Oxxo (de noche)\n- Ramiro, el que vendía discos en la plaza\n\nSe llaman con dos cencerradas cortas. Se calman con una larga. Si uno se me va, lo dejo: el Hermano dice que el Durmiente los recoge solo.\nNo bajar de la azotea hasta que salga el sol. El sol ya no sale.": "コンスティトゥシオン通りの群れ（私の担当）\n- 金物屋の二人（兄弟）\n- オクソの夜番の若いの\n- ラミロ、広場でレコードを売っていた男\n\nカウベルを短く二度で呼ぶ。長く一度で鎮める。一人逃げても放っておく：眠れる者が自分で拾うと兄弟が言った。\n日が昇るまで屋上から下りるな。日はもう昇らない。",
"SERVICIO POSTAL MEXICANO · SUCURSAL SAHUAYO · AVISO\nPor instrucciones superiores (?) no se recibirá ni entregará correspondencia hasta nuevo aviso.\n\n(abajo, a mano, en el reverso de un recibo:)\nCuca: te dejé tu carta de tu hija en el cajón de las estampillas. No la pude entregar porque ya no estabas en el puesto, estabas en el pasillo, parada, diciendo \"qué va a llevar\" sin nadie. Perdóname. Me voy a Jiquilpan a pie.\n—Toño": "メキシコ郵便局 · サウアヨ支局 · 掲示\n上からの指示（？）により、追って通知があるまで郵便の受付も配達も行いません。\n\n（下に、手書きで、領収書の裏に：）\nクカへ：娘さんからの手紙は切手の引き出しに入れておいた。渡せなかったのは、あんたがもう店にいなかったからだ。通路に突っ立って、誰もいないのに「何にしましょう」って言ってた。許してくれ。ヒキルパンまで歩いて行く。\n—トニョ",
"Lo que no quiero que lean los de la Hermandad:\n\nLos nombres de los que todavía hablaban y me buscaron: en la sacristía, en la calle, en recados por debajo de la puerta. Del confesionario no se escribe nada; eso se queda conmigo. Los que faltan en mi libreta: Nachito, el que barre la plaza. Doña Chelo, la de los tamales. El profe Gudiño. Mi sobrina Lupe.\n\nSi me matan, que alguien los diga en voz alta en un lugar donde se oiga. No un rezo. Un pase de lista.\n\nY el año del candado de abajo es el año en que lo cerraron: el del niño.": "兄弟団に読まれたくないこと：\n\nまだ話せて、私を訪ねてきた人々の名前：聖具室で、通りで、扉の下に差し込まれたメモで。告解で聞いたことは何も書かない。それは私と共にある。手帳に足りない名前：広場を掃くナチート。タマレス屋のチェロおばさん。グディニョ先生。姪のルペ。\n\n私が殺されたら、誰かが声の届く場所でこの名を声に出して呼んでほしい。祈りではなく。点呼を。\n\nそして下の錠の年は、閉ざされた年だ：あの少年の年。",
"AQUÍ DESCANSAN LOS RESTOS DE\nJ. TRINIDAD GÁLVEZ\nCRISTERO\n† 1928\n\"MURIÓ POR CRISTO REY Y POR SU PUEBLO\"\n\n(rayado encima con un clavo:) DESPIERTA": "ここに眠る\nJ・トリニダー・ガルベス\nクリステロ\n† 1928\n「王なるキリストと故郷のために死す」\n\n（釘で上から引っかいて：）DESPIERTA — 目覚めよ",
"✝ HERMANDAD DEL SANTO DESPERTAR ✝\nSAHUAYENSE: el pueblo ya despertó. No tengas miedo del que camina y no habla: está corrigiéndose.\nNO prendas luces. NO pongas música. NO digas nombres.\nSi oyes la campana grande, VEN.\nEl Hermano Celso te espera en el cerro.": "✝ 聖なる目覚めの兄弟団 ✝\nサウアヨの民へ：町は目覚めた。歩きながら話さない者を恐れるな：正されている途中だ。\n明かりをつけるな。音楽をかけるな。名前を口にするな。\n大きな鐘が聞こえたら、来い。\nセルソ兄弟が丘でお前を待っている。",
"A quien suba:\nLas campanas se tocan con la cuerda, tres jalones largos, no más, porque la grande está cuarteada desde el temblor.\nDesde el 24 suenan solas y nadie jala nada. Yo me bajé y ya no subo.\nDesde que sacaron la vasija suenan distinto. Como si ya no fueran de bronce. Como si el golpe cayera en un pozo.\nSi las tocas tú, que sea por algo bueno.\n—Chon, campanero desde 1979": "登ってきた者へ：\n鐘は綱で鳴らす。長く三度、それ以上はだめだ。大きいのは地震以来ひびが入っている。\n二十四日から鐘は勝手に鳴る。誰も綱を引いていない。私は下りた。もう登らない。\n壺が運び出されてから音が変わった。青銅じゃなくなったみたいに。打った音が井戸の底に落ちていくみたいに。\nお前が鳴らすなら、良いことのために鳴らしてくれ。\n—チョン、一九七九年より鐘つき",
"PEDIDOS\n- 40 pares tejidos, para la Hermandad (sin cobrar, dice mi papá)\n- 12 pares para la danza de los tlahualiles (cancelada, se quedan)\n\nMi papá se fue a la procesión con los 40 pares puestos en una lona. No regresó. Dejé la troca prendida para que vea la luz si vuelve de noche.\n—Memo Sandoval": "注文\n- 編みのワラチェ四十足、兄弟団へ（代金は取らないと親父が言う）\n- トラワリルの踊り用に十二足（中止。残る）\n\n親父は四十足を防水布に並べて行列へ出かけた。戻ってこなかった。夜に帰ってきたら明かりが見えるように、ピックアップのエンジンをかけたままにしておく。\n—メモ・サンドバル",
"ESTOS NICHOS SE VACIARON EN 1931 PARA LLEVAR A LOS NUESTROS ARRIBA, A LA LUZ.\nLO QUE QUEDÓ ABAJO NO ERA NUESTRO.\nNO SE CAVE MÁS ABAJO DE ESTA PIEDRA.\n\n(abajo, con pintura fresca:) Cavamos.": "この壁龕は一九三一年、我らの者を光の下へ運び上げるために空にされた。\n下に残ったものは、我らのものではなかった。\nこの石より下は掘るな。\n\n（下に、新しいペンキで：）掘った。",
"ORDEN PARA ESTA NOCHE (Hermano Celso)\n1. Generador apagado. Nada de bocinas: él no quiere ruido que no sea de nosotros.\n2. Campana chica: solo yo la toco.\n3. Nombres prohibidos en la explanada: los de la lista de la Vidente (los que se pueden despertar de a de veras). Si alguien los dice, cencerro largo y se lo llevan abajo.\n4. Decir en voz alta nada más estos: \"el Durmiente\", \"el Despierto\", \"el Corazón Viejo\", \"Tzacuatlayotl\".\n5. Si él habla, nadie conteste. No es demonio: es más grande que eso, y nosotros somos polvo.": "今夜の段取り（セルソ兄弟）\n一、発電機は切る。スピーカーは使わない：彼は我らのもの以外の音を望まない。\n二、小さな鐘は私だけが鳴らす。\n三、広場で口にしてはならない名前：お告げの女のリストにある者たち（本当に目覚めさせられる者たち）。誰かが口にしたら、長いカウベルで下へ連れていく。\n四、声に出していいのはこれだけ：「眠れる者」「目覚めし者」「古い心臓」「ツァクアトラヨトル」。\n五、彼が語っても、誰も答えるな。彼は悪魔ではない：それより大きなもので、我らは塵だ。",
"La central de autobuses. Horario pegado en el vidrio con cinta. Adentro, un autobús con la puerta abierta y las luces de cabina prendidas. Nadie.": "バスターミナル。ガラスにテープで貼られた時刻表。中にはドアが開いたまま車内灯のついたバス。誰もいない。",
"Pintado con aerosol rojo, con letra de alguien que no sabe pintar: DESPIERTA SAHUAYO. Debajo, más chiquito: \"ya\".": "赤いスプレーで、描き慣れない字：DESPIERTA SAHUAYO——目覚めよ、サウアヨ。その下に小さく：「ya」——もう。",
"PRESIDENCIA MUNICIPAL · SAHUAYO DE MORELOS · \"Progreso, Justicia, Patria\". La placa tiene veladoras derretidas abajo.": "市役所 · サウアヨ・デ・モレロス · 「進歩、正義、祖国」。銘板の下に溶けたろうそく。",
"El mural de Sahuayo: tlahualiles, huaraches, las torres de la parroquia, Cristo Rey en el cerro. Está nuevo. Está bonito. Alguien le rayó los ojos a todas las caras.": "サウアヨの壁画：トラワリルの踊り手、ワラチェ、教会の塔、丘のクリスト・レイ。新しい。きれいだ。誰かが全部の顔の目を引っかいた。",
"TESORERÍA MUNICIPAL · Horario 9:00 a 15:00 · \"No se aceptan cheques\".": "市出納課 · 受付 9:00〜15:00 · 「小切手不可」。",
"REGISTRO CIVIL · Nacimientos, matrimonios, defunciones. La ventanilla de defunciones tiene una fila de veladoras.": "戸籍課 · 出生、婚姻、死亡。死亡届の窓口にろうそくが一列。",
"SALA DE CABILDO. Las sillas están todas volteadas hacia la ventana, como si hubieran estado viendo algo afuera.": "議会室。椅子が全部窓の方を向いている。外の何かを見ていたみたいに。",
"DIRECCIÓN DE SEGURIDAD PÚBLICA. En el pizarrón: \"TURNO NOCHE: nadie\". Y abajo, con otra letra: \"ya no hace falta\".": "公安課。ホワイトボードに「夜勤：なし」。その下に別の筆跡で「もう必要ない」。",
"OFICINA DEL C. PRESIDENTE MUNICIPAL. La puerta tiene una hoja clavada con una tachuela.": "市長室。扉に画鋲で紙が一枚留めてある。",
"HOTEL LATINO · 5 PISOS · \"Confort y tradición\". La cortina está arriba y el letrero de NO HAY CUARTOS, prendido.": "ホテル・ラティーノ · 五階建て · 「快適と伝統」。シャッターは上がり、「満室」の看板が点いている。",
"FARMACIA ROMA · Constitución 212. La vitrina rota desde adentro. En el vidrio, con plumón: \"Las medicinas DUERMEN. No surtimos\".": "薬局ロマ · コンスティトゥシオン212。内側から割られたショーウィンドウ。ガラスにマーカーで「薬は人を眠らせる。もう出さない」。",
"OFICINA DE CORREOS, en medio del mercado. La ventanilla cerrada. Un cajón entreabierto con estampillas.": "市場の真ん中の郵便局。窓口は閉まっている。切手の入った引き出しが半開き。",
"Carnicería \"La Michoacana\". Focos rojos prendidos, nada colgado de los ganchos. Las moscas sí.": "精肉店「ラ・ミチョアカナ」。赤い電球は点いているが、フックには何も掛かっていない。ハエだけはいる。",
"Puesto de fritangas. Las carnitas en el cazo, frías, con una costra de manteca blanca. Todavía huele.": "揚げ物の屋台。鍋のカルニータスは冷え、白いラードの膜が張っている。まだ匂う。",
"El retablo dorado. Santiago Apóstol a caballo. Alguien le quitó la espada y le puso un cencerro en la mano.": "金色の祭壇画。馬上の聖ヤコブ。誰かが剣を取り上げて、手にカウベルを持たせた。",
"La capilla del niño mártir. Exvotos, fotos, un huarachito de bronce, gallos de yeso. Todo intacto. Es el único lugar limpio de la ciudad.": "殉教した少年の礼拝堂。奉納物、写真、青銅の小さなワラチェ、石膏の雄鶏。何も荒らされていない。この町で唯一きれいな場所だ。",
"El baptisterio. Placa: \"Aquí estuvo preso el niño mártir en 1928\". La puerta tiene llave nueva.": "洗礼堂。銘板：「一九二八年、殉教した少年がここに囚われた」。扉の鍵は新しい。",
"La sacristía. Casullas colgadas, un cáliz, y en el piso una trampilla con una argolla de hierro.": "聖具室。掛けられた祭服、聖杯、そして床に鉄の輪のついた跳ね戸。",
"La galería inundada. El agua hasta la rodilla, fría, con olor a cantera. Cada paso suena en todo el túnel.": "水に浸かった通路。膝までの冷たい水、石切り場の匂い。一歩ごとにトンネル中に響く。",
"Un derrumbe. Tabique y tierra hasta el techo. Hay que rodear.": "崩落。レンガと土が天井まで。回り道だ。",
"La sala museo. Esculturas de yeso de santos y mártires, sin terminar, con la malla de alambre asomando. La escalera baja a las catacumbas.": "展示室。聖人と殉教者の石膏像、未完成で、針金の網が覗いている。階段はカタコンベへ下りる。",
"El coro. Un piano vertical con la tapa abierta. En el atril, un himno a lápiz: \"Despierta, Sahuayo\" en vez de \"Despierta, pecador\".": "聖歌隊席。蓋の開いたアップライトピアノ。譜面台に鉛筆書きの賛美歌：「目覚めよ、罪人」の代わりに「目覚めよ、サウアヨ」。",
"La puerta de la torre. Arriba, las campanas grandes. Suenan solas desde el 24.": "塔の扉。上には大きな鐘。二十四日から勝手に鳴っている。",
"Las tres campanas del Sagrado Corazón. La grande, cuarteada. Las cuerdas bajan hasta el piso de abajo.": "サグラド・コラソン教会の三つの鐘。大きいのにはひび。綱は下の階まで垂れている。",
"Placa en el atrio: \"En este lugar fueron fusilados 27 cristeros\". Veladoras nuevas debajo, prendidas.": "前庭の銘板：「この地で二十七名のクリステロが銃殺された」。下に新しいろうそく、火がついている。",
"Taller de huarache. Hormas colgadas, tiras de cuero, una radio con estática. Nadie.": "ワラチェ工房。吊るされた靴型、革の帯、ノイズを流すラジオ。誰もいない。",
"CALLE PADRE J. LUIS ARREGUI. Casas bajas, talleres. Al fondo baja al arroyo.": "パドレ・J・ルイス・アレギ通り。低い家並み、工房。突き当たりは小川へ下る。",
"Puente de concreto sobre El Infiernito. Alguien pintó en la barda: \"AQUÍ NO HAY INFIERNO, ES NOMÁS AGUA\".": "エル・インフィエルニート（小さな地獄）に架かるコンクリートの橋。塀に落書き：「ここに地獄はない。ただの水だ」。",
"Nichos vacíos. Las placas arrancadas. Esta galería es más vieja que las de arriba.": "空の壁龕。銘板は剥がされている。この通路は上のものより古い。",

"Madera oscura y retratos de presidentes municipales. A todos les tacharon la cara.": "暗い木材と歴代市長の肖像。全員の顔が塗りつぶされている。",
"Una pared.": "壁。",

"Una cama de hotel, tendida. Nadie durmió aquí.": "整えられたホテルのベッド。誰も寝ていない。",

"La tele de la recepción, con estática.": "ロビーのテレビ、砂嵐。",

"La antena del hotel. Un cencerro amarrado arriba, se mueve con el aire.": "ホテルのアンテナ。てっぺんにカウベルが結ばれ、風に揺れている。",
"Ropa tendida. Túnicas de manta, mojadas.": "干した洗濯物。濡れた木綿のローブ。",
"Una banca de iglesia. Rayada con uñas.": "教会の長椅子。爪で引っかかれている。",

"Un cirio. Prendido.": "大ろうそく。火がついている。",
"Exvotos: fotos de bebés, un huarache de bronce, una pulsera de hospital.": "奉納物：赤ん坊の写真、青銅のワラチェ、病院のリストバンド。",

"Réplica de la vasija, de barro, con forma de tortuga. Chiquita. La real está más abajo.": "亀の形をした土の壺の複製。小さい。本物はもっと下にある。",

"Pan del mercado. Duro, pero pan.": "市場のパン。固いが、パンだ。",
"La llave del cuarto 7, con su llavero de madera. Colgada aparte de las demás.": "木の札のついた7号室の鍵。他の鍵とは離して掛けてある。",

"Puerta de la azotea. Cerrada. Arriba suena un cencerro, despacio, como llamando.": "屋上の扉。閉まっている。上でカウベルがゆっくり、呼ぶように鳴っている。",

"Un diablito de carga, de los de bultos. Pesado, pero rueda.": "荷物運び用の台車。重いが、転がる。",

"El baptisterio. Cerrado con llave desde hace mucho. En la puerta, una placa: \"Aquí estuvo preso el niño mártir\".": "洗礼堂。長いこと鍵がかかっている。扉に銘板：「殉教した少年がここに囚われた」。",

"Un hombre sentado en su nicho, con sombrero, sin rifle. Levanta la mano como pidiendo algo que le falta.": "壁龕に座る帽子の男。銃がない。足りない何かを求めるように手を上げている。",

"Una cabeza de muñeca, de las de plástico duro, en el asiento de la troca. Los ojos se le mueven.": "硬いプラスチックの人形の頭。ピックアップの座席に。目が動く。",

"Un bidón de gasolina a medias, junto a la jardinera. Alguien lo usó para las lámparas.": "半分残ったガソリン缶、花壇のそば。誰かがランプに使った。",

"...Ora webos. ¿Qué chingados traes ahí?": "…おいおい。何を持ってるんだ？",

"(respira) Está vivo. Está... respirando. Con los ojos abiertos.": "（息をつく）生きてる。息を…してる。目を開けたまま。",

"Luz de emergencia. Papeles en el piso. Huele a veladora.": "非常灯。床に散らばった書類。ろうそくの匂い。",

"...Mejor no le hablo de frente.": "…正面から声をかけないほうがいいな。",

"...No. Esto no es una borrachera. Esto no es nada que yo conozca.": "…違う。これは酒のせいじゃない。おれの知ってるどんなものでもない。",

"Balas. Perdón, oficial.": "弾だ。すまない、おまわりさん。",

"CAPÍTULO 6 COMPLETADO": "第六章 完了",
"CAPÍTULO 7 COMPLETADO": "第七章 完了",
"Constitución pa abajo, hasta la plaza. Tres cuadras. Caminando con mi abuela eran diez minutos.": "コンスティトゥシオン通りを下って広場へ。三ブロック。ばあちゃんと歩くと十分かかった。",
"El Hotel Latino. Cinco pisos. Y desde la azotea un cencerro, despacio, como llamando a alguien.": "ホテル・ラティーノ。五階建て。屋上からカウベルが、ゆっくり、誰かを呼ぶみたいに。",
"...¿Esos son perros? No ladran. Van con las manos.": "…あれは犬か？吠えない。手をついて歩いてる。",
"El del cencerro los trae. Si se calla el cencerro, a lo mejor se van.": "カウベルの奴が操ってる。カウベルが止まれば、いなくなるかもしれない。",
"Se calló el cencerro.": "カウベルが止まった。",
"...Abajo ya no se oyen. Perdón, hermano. O lo que fueras.": "…下からはもう聞こえない。すまない、兄弟。それとも何だったのか知らないが。",
"Quince años y la Roma sigue abriendo a las ocho. Bueno. Abría.": "十五年経っても薬局ロマは八時開店か。いや。だった、だな。",
"El Nievero. El mismo carrito. Y la campana sonando sola.": "アイス屋のおじさん。同じ屋台。鈴が勝手に鳴ってる。",
"El fantasma señala la campana del carrito. Golpéala (F) para callarla.": "幽霊が屋台の鈴を指す。叩いて（F）黙らせろ。",
"...Gracias, don. De limón, la próxima.": "…ありがとう、おじさん。今度はライムで。",
"La plaza llena un domingo a las seis de la mañana. Y nadie habla.": "日曜の朝六時に広場が満員だ。それで誰もしゃべらない。",
"Están viendo la Parroquia. Todos. Mejor no me les acerco.": "教会を見てる。全員だ。近づかないほうがいい。",
"La reja con cadena y dos carros atravesados. Por el Mercado, pues: la puerta de Sahagún.": "鎖のかかった門と道をふさぐ二台の車。じゃあ市場から：サアグン通りの扉だ。",
"El Mercado. Huele a fritanga fría y a focos rojos. Alguien dice \"qué va a llevar\" sin que haya nadie.": "市場。冷えた揚げ物と赤い電球の匂い。誰もいないのに「何にしましょう」と言う声。",
"Ese señor... está hinchado. Como si hubiera comido tres días seguidos sin parar. No se mete por los pasillos: mejor.": "あの男…膨れ上がってる。三日間食い続けたみたいに。通路には入ってこられない：ありがたい。",
"La reja a Sahagún. Un boquete abajo y un carrito atorado. Con el diablito de los bultos la palanqueo.": "サアグン通りへの鉄格子。下の隙間にカートが詰まってる。荷物用の台車でこじ開けてやる。",
"Ya. Sahagún. La puerta de la Parroquia está ahí enfrente.": "よし。サアグン通りだ。教会の扉は真向かい。",
"Aquí me bautizaron. Aquí lo tuvieron al niño. Yo venía con mi abuela.": "ここで洗礼を受けた。あの少年が閉じ込められた場所だ。ばあちゃんと来てた。",
"Las veladoras prendidas. Alguien sigue aquí.": "ろうそくに火がついてる。まだ誰かいる。",
"¿Liobas? ¿El de doña Chuy? Dios mío. Pasa, pasa, cierra.": "リオバスか？チュイさんとこの？なんと。入れ、入れ、扉を閉めろ。",
"Padre, ¿qué pasó aquí?": "神父さん、ここで何があったんだ？",
"Lo que pasa cuando la gente reza enojada. Eran de aquí. Rosario de los jueves. Buenas personas, hijo, no te voy a decir que no. Y de repente la fiesta les dio asco.": "怒りながら祈るとこうなるのだよ。地元の者たちだ。木曜のロザリオの会。善い人たちだった、息子よ、それは否定しない。それが急に、祭りを嫌悪するようになった。",
"\"Sodoma\", decían. \"Sahuayo duerme.\" Yo pensé: es la edad, se les pasa.": "「ソドムだ」と言っていた。「サウアヨは眠っている」と。歳のせいだ、そのうち収まると思った。",
"¿Y luego?": "それで？",
"Luego empezaron a subir el cerro de rodillas. Luego a cavar abajo del Sagrado Corazón. Dijeron que habían encontrado \"el corazón viejo del pueblo\". Una vasija. Una tortuga.": "それから膝で丘を登り始めた。それからサグラド・コラソンの下を掘り始めた。「町の古い心臓」を見つけたと言った。壺だ。亀だ。",
"Dicen que es el nombre viejo del pueblo. Tzacuatlayotl: la vasija, la tortuga. Quién sabe si Sahuayo se llamó así alguna vez, hijo.": "町の古い名だと言うのだ。ツァクアトラヨトル：壺、亀。サウアヨが本当にそう呼ばれたことがあるのか、誰にもわからんよ。",
"Ellos decidieron que sí. Y le rezaron al nombre como si fuera santo.": "あの者たちはそうだと決めた。そして聖人にするように、その名に祈った。",
"Padre, con todo respeto, eso suena a...": "神父さん、失礼だけど、それはまるで…",
"A locura. Sí. Hasta que la noche del 24 sonaron todas las campanas solas. Todas. Y la gente salió a la calle y ya no volvió a entrar.": "狂気のようだろう。そうだ。二十四日の夜、全部の鐘が勝手に鳴るまではな。全部だ。人々は通りに出て、二度と戻らなかった。",
"El sábado no amaneció, Liobas. Mira el reloj de la torre: da la hora como si nada. El cielo no.": "土曜日は夜が明けなかったのだよ、リオバス。塔の時計を見ろ：何事もないように時を刻む。空はそうじゃない。",
"Yo me encerré aquí con Lupe. Lupe ya no está.": "私はルペとここに閉じこもった。ルペはもういない。",
"...Lo siento.": "…ご愁傷さまです。",
"Desde que cavaron, el 2 de julio, llevo escribiendo lo que sé en esta libreta. Toma la llave del baptisterio: ahí escondí una hoja que no quiero que lean ellos. Léela y vuelve.": "奴らが掘り始めた七月二日から、知ったことをこの手帳に書いている。洗礼堂の鍵を持っていけ：奴らに読まれたくない紙を隠してある。読んで戻ってこい。",
"¿Ya la leíste? Entonces ya sabes lo que yo: no es un exorcismo, hijo. Es una lista de nombres.": "読んだか？なら私と同じことを知ったな：悪魔祓いじゃない、息子よ。名前のリストだ。",
"Las catacumbas llegan al Sagrado Corazón. Ahí están las campanas grandes. Si las toco, vienen todos. Y entonces los bendigo desde la torre. Es la única forma de alcanzarlos a todos.": "カタコンベはサグラド・コラソン教会まで続いている。大きな鐘はそこにある。鳴らせば皆が来る。そうしたら塔から皆を祝福する。全員に届く唯一の方法だ。",
"¿Y si no funciona?": "うまくいかなかったら？",
"Entonces corres, hijo. Yo ya estoy viejo. La trampilla de la sacristía: ya la abrí. Nos vemos arriba.": "そのときは走れ、息子よ。私はもう年寄りだ。聖具室の跳ね戸は開けておいた。上で会おう。",
"Ve al baptisterio primero. La llave ya la tienes.": "先に洗礼堂へ行け。鍵はもう持っているだろう。",
"Nos vemos arriba, hijo. Ve con Dios. O con quien sea que quede.": "上で会おう、息子よ。神と共に行け。あるいは、まだ残っている誰かと。",
"Una señora con una veladora apagada. No me ve a mí: ve la puerta de Sahagún.": "消えたろうそくを持った婦人。おれを見ていない：サアグン通りの扉を見ている。",
"Pide prender la veladora de su hijo en la puerta lateral. Cuando esté prendida, vuelve con ella.": "横の扉で息子のろうそくを灯してほしいと頼んでいる。灯したら、彼女のところへ戻れ。",
"Ya quedó, señora. Ya está prendida.": "終わったよ、奥さん。火はついた。",
"La señora señala el altar de la Parroquia y se va con la niebla. Detrás del altar hay algo.": "婦人は教会の祭壇を指し、霧とともに消える。祭壇の裏に何かある。",
"Pa abajo, pues. Como el niño.": "じゃあ下へ。あの少年みたいに。",
"Tabique, nichos, placas con nombres. Y veladoras nuevas. Aquí anduvieron hace poco.": "レンガ、壁龕、名前の銘板。それに新しいろうそく。奴らは少し前までここにいた。",
"Está oscuro. La radio chasquea sin parar aquí abajo: puedes apagarla con T.": "暗い。この下では無線がノイズを鳴らしっぱなしだ：Tで切れる。",
"Suenan antes de verse. Como el traje de los danzantes, pero despacio.": "見える前に音が聞こえる。踊り手の衣装みたいな音、でもゆっくりだ。",
"¿Qué... ? Una máscara de tlahualil. Pegada. Pegada a la cara.": "何だ…？トラワリルの仮面。貼りついてる。顔に貼りついてる。",
"Es de tlahualil... pero alguien le hizo algo. Le quitaron los colores y le taparon los ojos con cera.": "トラワリルの仮面だ…でも誰かが細工した。色を剥がして、目を蝋でふさいである。",
"Corre más rápido que yo. No le voy a dar con nada. Mejor no hacer ruido.": "おれより速い。何をぶつけても効かない。音を立てないほうがいい。",
"Un señor sentado en su nicho, con sombrero. Sin rifle. Me enseña las manos vacías.": "壁龕に座った帽子の男。銃がない。空っぽの手を見せてくる。",
"Tenga, don. Ya está.": "ほら、おじさん。これでいい。",
"El Cristero se acomoda el sombrero y golpea la pared con la culata. El tabique cede: hay un atajo.": "クリステロは帽子を直し、銃床で壁を叩く。レンガが崩れる：近道だ。",
"Candado de cuatro números. \"El año en que se cerró\". El Padre dijo: el del niño.": "四桁の錠。「閉ざされた年」。神父は言った：あの少年の年だと。",
"Mil novecientos veintiocho. Abrió.": "一九二八。開いた。",
"El Sagrado Corazón. La nave enorme, las flores secas. Y el piano del coro con la tapa abierta.": "サグラド・コラソン教会。巨大な身廊、枯れた花。蓋の開いた聖歌隊席のピアノ。",
"(una tecla) ...Perdón.": "（鍵盤を一つ）…すまん。",
"Cuatro pisos de caracol. Por las ventanas, el pueblo en niebla, y por todas las calles gente caminando pa acá. Despacio.": "四階分のらせん階段。窓からは霧の町と、あらゆる通りをこっちへ歩いてくる人々。ゆっくりと。",
"Las ocho y media. Y sigue siendo de noche.": "八時半。それでもまだ夜だ。",
"La cuerda de las campanas. Jala tres veces (E).": "鐘の綱。三度引け（E）。",
"Una.": "一。",
"Dos.": "二。",
"Tres.": "三。",
"(desde abajo, subiendo) ¡Ya vienen! ¡Por Madero, por Hidalgo, por Monterde! ¡Todos!": "（下から、登りながら）来たぞ！マデロ通りから、イダルゴ通りから、モンテルデ通りから！全員だ！",
"(gritando por la ventana) ¡EN EL NOMBRE DEL PADRE, DEL HIJO...!": "（窓から叫んで）父と、子と…の御名において！",
"...No pasa nada, Padre.": "…何も起きないよ、神父さん。",
"...No. Sí pasa. Todos levantaron la cara. Y las campanas siguen solas. Más fuerte.": "…いや。起きてる。全員が顔を上げた。鐘はまだ勝手に鳴ってる。もっと強く。",
"Toma la libreta. Vete por Arregui, al arroyo. Hay una entrada vieja. Léela allá arriba, no aquí. ¡Corre, hijo!": "手帳を持っていけ。アレギ通りから小川へ。古い入口がある。あの上で読め、ここじゃない。走れ、息子よ！",
"El Campanero. Está subiendo.": "鐘つきだ。上がってくる。",
"¡No lo puedo tumbar! ¡Corre!": "倒せない！走れ！",
"Arregui. El Padre dijo al arroyo.": "アレギ通り。神父は小川へと言った。",
"Talleres de huarache, hormas colgadas. Y una troca con el motor prendido, sin nadie.": "ワラチェ工房、吊るされた靴型。それにエンジンのかかったピックアップ、誰も乗っていない。",
"El Infiernito. Qué nombre pa un arroyo. Qué nombre pa esta noche.": "エル・インフィエルニート。小さな地獄。小川にしちゃ大層な名前だ。今夜にはぴったりだが。",
"Una niña parada en el agua. Con una muñeca sin cabeza. No me ve.": "水の中に立つ少女。首のない人形を抱えて。おれを見ていない。",
"Ten. Ya está completa.": "ほら。これで全部揃った。",
"La niña abraza la muñeca y señala el talud: una boca de piedra con una cruz de hierro oxidada. Luego se hunde en el agua, despacio, sin una burbuja.": "少女は人形を抱きしめ、土手を指す：錆びた鉄の十字架のある石の口。それから水に沈んでいく。ゆっくり、泡ひとつ立てずに。",
"Roca, goteo, y luego tabique viejo. Las catacumbas de abajo de las catacumbas.": "岩、水滴、それから古いレンガ。カタコンベの下のカタコンベ。",
"Esto no sale en las visitas de las catacumbas. Esto no lo sabe nadie.": "これはカタコンベの見学では見せない。誰も知らない場所だ。",
"Una veladora grande, con cerillos. Alguien la dejó aquí a propósito.": "マッチ付きの大きなろうそく。誰かがわざとここに置いた。",
"V: prender o apagar la veladora. Los Enmascarados no cruzan su luz. Si corres, se apaga.": "V：ろうそくを灯す／消す。仮面の者たちはその光を越えられない。走ると消える。",
"(la radio, apagada, chasquea) ...está tibia.": "（切ったはずの無線がノイズを鳴らす）…温かい。",
"Ahí está. La vasija. La tortuga. Está tibia.": "あった。壺だ。亀だ。温かい。",
"...Eso lo dije yo. Todavía no lo decía.": "…今のはおれの声だ。まだ言ってなかったのに。",
"Duermen alrededor. Todos con la máscara. Si corro, despiertan. Despacio.": "周りで眠ってる。全員仮面をつけて。走れば目を覚ます。ゆっくりだ。",
"¡Despertaron!": "目を覚ました！",
"Ciento cuarenta escalones, dijo la libreta. Pa arriba.": "百四十段、と手帳にあった。上へ。",
"Página 1. La cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz.": "一頁。下にいるあれは悪魔でも聖人でもない。あれは場所だ。あれは名前だ。呼ばれれば目覚め、放っておけば眠る。",
"Página 2. Los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije \"Lupe\". Un segundo. Luego se fue.": "二頁。取り憑かれた者は自分の名前に反応する。「ルペ」と呼ぶと、ルペは私を振り返った。一秒だけ。それから行ってしまった。",
"Página 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.": "四頁。皆に聞こえる場所に登れ。鐘を鳴らして呼べ。そして祈るな：名前を呼べ。一人ずつ。彼らが目覚めていることに疲れるまで。",
"Cristo Rey. La explanada, el pedestal, las bocinas apuntando al pueblo. Y abajo, en la niebla, todas las campanas.": "クリスト・レイ。広場、台座、町を向いたスピーカー。そして下の霧の中、すべての鐘。",
"El generador. Sin gasolina. Había un bidón por las jardineras.": "発電機。ガソリンがない。花壇のあたりに缶があった。",
"Arrancó a la segunda. Mejor que el Tsuru.": "二回目でかかった。ツルよりましだ。",
"La campana chica de la capilla. Tres veces (E).": "礼拝堂の小さな鐘。三度（E）。",
"Ya vienen. Por la escalinata, despacio. Al micrófono.": "来る。階段を、ゆっくり。マイクへ。",
"Probando... Sahuayo. Soy Liobas, el de doña Chuy. Me fui hace quince años. Ya volví.": "テスト中…サウアヨ。リオバスだ、チュイさんとこの息子だ。十五年前に出ていった。帰ってきた。",
"No les voy a rezar. Les voy a pasar lista.": "祈ったりしない。点呼を取る。",
"...Una campana se calló.": "…鐘が一つ、黙った。",
"Ese no es de aquí. Ese es el nombre de la cosa. Suben más rápido.": "それはこの町の名前じゃない。あれの名前だ。奴らの登りが速くなる。",
"Silencio.": "静寂。",
"La gente sube las escaleras despacio. Se sienta en los escalones. Se duerme. La Hermandad, sin campanas, se queda parada en la explanada sin saber qué hacer.": "人々はゆっくり階段を登る。段に腰を下ろす。眠る。鐘を失った兄弟団は、どうしていいかわからず広場に立ち尽くす。",
"Amanece sobre la Ciénega. Por fin. Una luz se prende abajo: primero en el llano, luego en los tejados. Al revés.": "湿地に夜が明ける。ようやく。下で光が灯る：まず平野に、それから屋根に。逆さまに。",
"Despierta, Sahuayo.": "目覚めろ、サウアヨ。",
"Los Enmascarados llegaron a la explanada.": "仮面の者たちが広場に着いた。",
"LA PROCESION DE LOS DORMIDOS\n\nSHY Studios · 2019-2026\nCalles reales: OpenStreetMap (ODbL). Personajes y hechos: ficción. La Hermandad, la vasija y lo que hay debajo de Sahuayo son invención.\nAudio y gráficos sintetizados. Gracias por volver.": "LA PROCESION DE LOS DORMIDOS\n\nayotl.dev · 2019-2026\n実在の通り：OpenStreetMap（ODbL）。人物と出来事：フィクション。兄弟団、壺、サウアヨの地下にあるものは創作です。\n音と絵はすべて合成。帰ってきてくれてありがとう。",
"...A la primera. Pinche Tsuru.": "…一発でかかった。このツルめ。",
"FIN DE LA DEMO\n\nLa procesión sigue abajo: las catacumbas, el Sagrado Corazón, el Infiernito, el túnel y Cristo Rey. Cinco capítulos más.\n\nEl juego completo: ayotl.dev/procesion": "デモ終了\n\n行列は下へと続く：カタコンベ、サグラド・コラソン、エル・インフィエルニート、トンネル、そしてクリスト・レイ。あと五章。\n\n完全版：ayotl.dev/procesion",
"Ay, Dios mío. Ay, Dios mío.": "ああ、神様。ああ、神様。",
"...No mames. No mames, no mames.": "…嘘だろ。嘘だ、嘘だ。",
"Era de aquí. Seguro lo conocía.": "地元の人だ。きっと知ってる人だ。",
"(respira) Ya. Ya quedó. No se mueve.": "（息をつく）よし。終わった。動かない。",
"Quédese ahí, vecino. Por favor.": "そこにいてくれ、ご近所さん。頼む。",
"No era usted. No era usted.": "あんたじゃなかった。あんたじゃなかったんだ。",
"Perdón, don. Perdón.": "すまない、おじさん。すまない。",
"...Respira. Está respirando.": "…息をしてる。生きてる。",
"...Era un muchacho.": "…若い奴だった。",
"Perdón, mijo.": "すまない、坊主。",
"Iba en cuatro patas y era gente.": "四つん這いで、でも人間だった。",
"...Ya. Descanse.": "…もういい。休んでくれ。",
"Tanta comida y nadie lo sentó a la mesa.": "あんなに食べ物があって、誰も食卓に座らせてやらなかった。",
"Nada. Una foto de su hija y un billete de veinte.": "何もない。娘の写真と二十ペソ札。",
"Las llaves de una patrulla que ya no arranca.": "もう動かないパトカーの鍵。",
"Un radio sin pila. Nada que sirva.": "電池切れの無線。使える物はない。",
"Balas. Las voy a necesitar más que usted.": "弾だ。あんたよりおれが必要だ。",
"Un cargador. Perdón. De veras, perdón.": "弾倉だ。すまない。本当にすまない。",
"Clic. Nada.": "カチ。何も出ない。",
"Vacía. Chingada madre.": "空だ。くそったれ。",
"La campana se calló": "鈴が黙った",
"Veladora: progreso guardado": "ろうそく：進行を保存",
"Interruptor: audio encendido": "ブレーカー：音響オン",
"Llave del baptisterio": "洗礼堂の鍵",
"La veladora se apagó": "ろうそくが消えた",
"Veladora apagada": "ろうそくを消した",
"Radio apagada": "無線オフ",
"Radio encendida": "無線オン",
"Veladora prendida (no corras)": "ろうそく点灯（走るな）",
"Balas +4": "弾 +4",
"El generador. Sin gasolina. Había un bidón al pie de la escalinata.": "発電機。ガソリンがない。階段の下に缶があった。",
"Un bidón de gasolina a medias, al pie de la escalinata. Alguien lo usó para las lámparas.": "半分残ったガソリン缶、階段の下。誰かがランプに使った。",
"Don Beto (panadería)": "ベトさん（パン屋）",
"Chayo Villanueva": "チャヨ・ビジャヌエバ",
"Profe Amezcua": "アメスクア先生",
"Licha (tortillería)": "リチャ（トルティーヤ屋）",
"Padre Nemesio": "ネメシオ神父",
