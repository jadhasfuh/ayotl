  const docs = {
    doc06: { title: 'Nota del Hotel Latino', font: 'pluma', text: 'Para quien venga a cubrir el turno:\nNO le abran al del cuarto 7. Lleva tres días sin salir y pide que le lleven el desayuno "con la campanita". No tenemos campanita.\nLa llave de la azotea la tiene él. No sé por qué se la di.\n—Yola', names: ['Rubén Castañeda (don Rubén, cuarto 7)'] },
    doc07: { title: 'Receta con anotación', font: 'pluma', text: 'Receta: Clonazepam 2 mg. Paciente: ——. Médico: Dr. ——.\n\n(al reverso, con plumón:)\nYa no surto. Vinieron tres de la Hermandad a decir que las medicinas "duermen". Me quitaron el estante completo.\nSi alguien necesita algo, está debajo del mostrador, en la caja de las vendas.\nQue Dios me perdone por lo que les dije.', names: ['Lic. Ramírez (Farmacia Roma)'] },
    doc08: { title: 'Cuaderno de la Hermandad', font: 'pluma', text: 'RITO DEL DESPERTAR\n(copiado de la Vidente, que lo copió del sueño)\nI. Se baja a donde están los que murieron por Cristo Rey y se les pide permiso.\nII. Se cava bajo la tercera cruz hasta hallar el corazón viejo del pueblo. (Hallado el 2 de julio. Es una vasija. Tortuga. Pesa como un hombre.)\nIII. Se sube al cerro con el corazón. Cuarenta veladoras por cada año desde que la fiesta se echó a perder: la Vidente dice que fue en el 85. (Hicimos 1,640. Faltaron.)\nIV. Se llama al Durmiente por su nombre viejo tres veces y por su nombre nuevo tres veces.\nV. Se le ofrece lo que el pueblo más quiere: la fiesta. Las máscaras. La comida. El ruido.\nVI. Cuando despierte, nosotros ya estaremos despiertos y los demás se corregirán.\n\n(otra letra:) Punto VI no está pasando como dijo. Los demás no se corrigieron: se quedaron en lo que estaban haciendo. El Hermano dice que eso ES la corrección. Yo ya no sé.\n\n(otra letra, grande:) NO LE DIGAN SU NOMBRE EN VOZ ALTA. VIENE.', names: ['Hermano Celso Ibarra'] },
    doc09: { title: 'Última página de Doña Eduviges', font: 'pluma', text: 'Yo nomás quería que dejaran de poner la música tan fuerte en la plaza. Eso era todo. Que mi hijo no llegara borracho el 25. Que el padre no tuviera que gritar la misa encima del sonido.\nSe lo pedí a Dios y me contestó otro. Yo creí que era Él porque hablaba bonito.\nAhora el Hermano dice que yo soy santa y me tiene aquí abajo para que no me vaya.\nSi alguien lee esto: no le recen. No lo llamen. Llámenlos a ellos. Por su nombre. Como cuando uno llama a los hijos a cenar. Eso sí lo oyen.\n—Eduviges Hernández, 71 años. Perdón.', names: ['Eduviges Hernández'] },
    doc10: { title: 'La libreta del Padre Anselmo', font: 'pluma', text: 'Cuaderno de pasta dura, letra de cura.\n\nPágina 1. Lo que sé: la cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz. La Hermandad lo llama con campanas. Yo pensé que podía bendecirlo con campanas. Error de viejo.\n\nPágina 2. Lo que vi: los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije "Lupe". No "hija", no "mujer": Lupe. Un segundo. Luego se fue.\n\nPágina 3. Lista: todos los que tú vayas sabiendo. Apúntalos. Los nombres son lo único que no se les olvidó.\n\nPágina 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.', names: ['Lupe (sacristana)', 'Padre Anselmo'] },
    doc11: { title: 'Libro de registro del hotel', font: 'maquina', text: 'HOTEL LATINO · REGISTRO DE HUÉSPEDES · JULIO\n\n19 — Cuarto 3: Sr. Vargas, viajante de huarache. Pagó dos noches.\n21 — Cuarto 7: Rubén Castañeda. "Es de aquí, pero ya no quiere dormir en su casa". Pagó una semana. Trae campanitas en una bolsa.\n22 — Cuarto 5: dos muchachos de Jiquilpan que venían al Festival. Se fueron sin pagar cuando les dijeron que se canceló.\n23 — Nadie.\n24 — Nadie. Don Rubén pidió que le subieran el desayuno con la campanita. Yola dijo que no.\n25 — (sin letra; la página está marcada con cera de veladora)', names: ['Rubén Castañeda (don Rubén, cuarto 7)'] },
    doc12: { title: 'Lista del Penitente', font: 'pluma', text: 'REBAÑO DE CONSTITUCIÓN (a mi cargo)\n- Los dos de la ferretería (hermanos)\n- El muchacho del Oxxo (de noche)\n- Ramiro, el que vendía discos en la plaza\n\nSe llaman con dos cencerradas cortas. Se calman con una larga. Si uno se me va, lo dejo: el Hermano dice que el Durmiente los recoge solo.\nNo bajar de la azotea hasta que salga el sol. El sol ya no sale.', names: ['Ramiro (el de los discos)'] },
    doc13: { title: 'Aviso de Correos', font: 'maquina', text: 'SERVICIO POSTAL MEXICANO · SUCURSAL SAHUAYO · AVISO\nPor instrucciones superiores (?) no se recibirá ni entregará correspondencia hasta nuevo aviso.\n\n(abajo, a mano, en el reverso de un recibo:)\nCuca: te dejé tu carta de tu hija en el cajón de las estampillas. No la pude entregar porque ya no estabas en el puesto, estabas en el pasillo, parada, diciendo "qué va a llevar" sin nadie. Perdóname. Me voy a Jiquilpan a pie.\n—Toño', names: ['Señora Cuca (mercado)', 'Toño (correos)'] },
    doc14: { title: 'Hoja escondida del Padre', font: 'pluma', text: 'Lo que no quiero que lean los de la Hermandad:\n\nLos nombres de los que todavía hablaban y me buscaron: en la sacristía, en la calle, en recados por debajo de la puerta. Del confesionario no se escribe nada; eso se queda conmigo. Los que faltan en mi libreta: Nachito, el que barre la plaza. Doña Chelo, la de los tamales. El profe Gudiño. Mi sobrina Lupe.\n\nSi me matan, que alguien los diga en voz alta en un lugar donde se oiga. No un rezo. Un pase de lista.\n\nY el año del candado de abajo es el año en que lo cerraron: el del niño.', names: ['Nachito (el que barre)', 'Doña Chelo (tamales)', 'Profe Gudiño'] },
    doc15: { title: 'Placa de un nicho', font: 'imprenta', text: 'AQUÍ DESCANSAN LOS RESTOS DE\nJ. TRINIDAD GÁLVEZ\nCRISTERO\n† 1928\n"MURIÓ POR CRISTO REY Y POR SU PUEBLO"\n\n(rayado encima con un clavo:) DESPIERTA', names: ['J. Trinidad Gálvez'] },
    doc16: { title: 'Volante de la Hermandad', font: 'imprenta', text: '✝ HERMANDAD DEL SANTO DESPERTAR ✝\nSAHUAYENSE: el pueblo ya despertó. No tengas miedo del que camina y no habla: está corrigiéndose.\nNO prendas luces. NO pongas música. NO digas nombres.\nSi oyes la campana grande, VEN.\nEl Hermano Celso te espera en el cerro.', names: [] },
    doc17: { title: 'Nota del campanero viejo', font: 'pluma', text: 'A quien suba:\nLas campanas se tocan con la cuerda, tres jalones largos, no más, porque la grande está cuarteada desde el temblor.\nDesde el 24 suenan solas y nadie jala nada. Yo me bajé y ya no subo.\nDesde que sacaron la vasija suenan distinto. Como si ya no fueran de bronce. Como si el golpe cayera en un pozo.\nSi las tocas tú, que sea por algo bueno.\n—Chon, campanero desde 1979', names: ['Chon (campanero viejo)'] },
    doc18: { title: 'Cuaderno del taller de huarache', font: 'pluma', text: 'PEDIDOS\n- 40 pares tejidos, para la Hermandad (sin cobrar, dice mi papá)\n- 12 pares para la danza de los tlahualiles (cancelada, se quedan)\n\nMi papá se fue a la procesión con los 40 pares puestos en una lona. No regresó. Dejé la troca prendida para que vea la luz si vuelve de noche.\n—Memo Sandoval', names: ['Memo Sandoval', 'Don Sandoval (huarachero)'] },
    doc19: { title: 'Inscripción en la galería vieja', font: 'imprenta', text: 'ESTOS NICHOS SE VACIARON EN 1931 PARA LLEVAR A LOS NUESTROS ARRIBA, A LA LUZ.\nLO QUE QUEDÓ ABAJO NO ERA NUESTRO.\nNO SE CAVE MÁS ABAJO DE ESTA PIEDRA.\n\n(abajo, con pintura fresca:) Cavamos.', names: [] },
    doc20: { title: 'Guion de la Hermandad para el cerro', font: 'pluma', text: 'ORDEN PARA ESTA NOCHE (Hermano Celso)\n1. Generador apagado. Nada de bocinas: él no quiere ruido que no sea de nosotros.\n2. Campana chica: solo yo la toco.\n3. Nombres prohibidos en la explanada: los de la lista de la Vidente (los que se pueden despertar de a de veras). Si alguien los dice, cencerro largo y se lo llevan abajo.\n4. Decir en voz alta nada más estos: "el Durmiente", "el Despierto", "el Corazón Viejo", "Tzacuatlayotl".\n5. Si él habla, nadie conteste. No es demonio: es más grande que eso, y nosotros somos polvo.', names: [] }
