  const docs = {
    doc06: { title: 'Nota del Hotel Latino', font: 'pluma', text: 'Para quien venga a cubrir el turno:\nNO le abran al del cuarto 7. Lleva tres días sin salir y pide que le lleven el desayuno "con la campanita". No tenemos campanita.\nLa llave de la azotea la tiene él. No sé por qué se la di.\n—Yola', names: ['Rubén Castañeda (don Rubén, cuarto 7)'] },
    doc07: { title: 'Receta con anotación', font: 'pluma', text: 'Receta: Clonazepam 2 mg. Paciente: ——. Médico: Dr. ——.\n\n(al reverso, con plumón:)\nYa no surto. Vinieron tres de la Hermandad a decir que las medicinas "duermen". Me quitaron el estante completo.\nSi alguien necesita algo, está debajo del mostrador, en la caja de las vendas.\nQue Dios me perdone por lo que les dije.', names: ['Lic. Ramírez (Farmacia Roma)'] },
    doc08: { title: 'Cuaderno de la Hermandad', font: 'pluma', text: 'RITO DEL DESPERTAR\n(copiado de la Vidente, que lo copió del sueño)\nI. Se baja a donde están los que murieron por Cristo Rey y se les pide permiso.\nII. Se cava bajo la tercera cruz hasta hallar el corazón viejo del pueblo. (Hallado el 2 de julio. Es una vasija. Tortuga. Pesa como un hombre.)\nIII. Se sube al cerro con el corazón. Cuarenta veladoras por cada año desde que la fiesta se echó a perder: la Vidente dice que fue en el 85. (Hicimos 1,640. Faltaron.)\nIV. Se llama al Durmiente por su nombre viejo tres veces y por su nombre nuevo tres veces.\nV. Se le ofrece lo que el pueblo más quiere: la fiesta. Las máscaras. La comida. El ruido.\nVI. Cuando despierte, nosotros ya estaremos despiertos y los demás se corregirán.\n\n(otra letra:) Punto VI no está pasando como dijo. Los demás no se corrigieron: se quedaron en lo que estaban haciendo. El Hermano dice que eso ES la corrección. Yo ya no sé.\n\n(otra letra, grande:) NO LE DIGAN SU NOMBRE EN VOZ ALTA. VIENE.', names: ['Hermano Celso Ibarra'] },
    doc09: { title: 'Última página de Doña Eduviges', font: 'pluma', text: 'Yo nomás quería que dejaran de poner la música tan fuerte en la plaza. Eso era todo. Que mi hijo no llegara borracho el 25. Que el padre no tuviera que gritar la misa encima del sonido.\nSe lo pedí a Dios y me contestó otro. Yo creí que era Él porque hablaba bonito.\nAhora el Hermano dice que yo soy santa y me tiene aquí abajo para que no me vaya.\nSi alguien lee esto: no le recen. No lo llamen. Llámenlos a ellos. Por su nombre. Como cuando uno llama a los hijos a cenar. Eso sí lo oyen.\n—Eduviges Hernández, 71 años. Perdón.', names: ['Eduviges Hernández'] },
    doc10: { title: 'La libreta del Padre Anselmo', font: 'pluma', text: 'Cuaderno de pasta dura, letra de cura.\n\nPágina 1. Lo que sé: la cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz. La Hermandad lo llama con campanas. Yo pensé que podía bendecirlo con campanas. Error de viejo.\n\nPágina 2. Lo que vi: los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije "Lupe". No "hija", no "mujer": Lupe. Un segundo. Luego se fue.\n\nPágina 3. Lista: todos los que tú vayas sabiendo. Apúntalos. Los nombres son lo único que no se les olvidó.\n\nPágina 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.', names: ['Lupe (sacristana)', 'Padre Anselmo'] },
    doc11: { title: 'Libro de registro del hotel', font: 'maquina', text: 'HOTEL LATINO · REGISTRO DE HUÉSPEDES · JULIO\n\n19 — Cuarto 3: Sr. Vargas, viajante de huarache. Pagó dos noches.\n21 — Cuarto 7: Rubén Castañeda. "Es de aquí, pero ya no quiere dormir en su casa". Pagó una semana. Trae campanitas en una bolsa.\n22 — Cuarto 5: dos muchachos de Jiquilpan que venían al Festival. Se fueron sin pagar cuando les dijeron que se canceló.\n23 — Nadie.\n24 — Nadie. Don Rubén pidió que le subieran el desayuno con la campanita. Yola dijo que no.\n25 — (sin letra; la página está marcada con cera de veladora)', names: ['Rubén Castañeda (don Rubén, cuarto 7)'] },
    doc12: { title: 'Lista del Penitente', font: 'pluma', text: 'REBAÑO DE CONSTITUCIÓN (a mi cargo)\n- Los dos de la ferretería (hermanos)\n- El muchacho del Oxxo (de noche)\n- Ramiro, el que vendía discos en la plaza\n\nSe llaman con dos cencerradas cortas. Se calman con una larga. Si uno se me va, lo dejo: el Hermano dice que el Durmiente los recoge solo.\nNo bajar de la azotea hasta que salga el sol. El sol ya no sale.', names: ['Ramiro (el de los discos)'] },
    doc13: { title: 'Aviso de Correos', font: 'maquina', text: 'SERVICIO POSTAL MEXICANO · SUCURSAL SAHUAYO · AVISO\nPor instrucciones superiores (?) no se recibirá ni entregará correspondencia hasta nuevo aviso.\n\n(abajo, a mano, en el reverso de un recibo:)\nCuca: te dejé tu carta de tu hija en el cajón de las estampillas. No la pude entregar porque ya no estabas en el puesto, estabas en el pasillo, parada, diciendo "qué va a llevar" sin nadie. Perdóname. Me voy a Jiquilpan a pie.\n—Toño', names: ['Señora Cuca (mercado)', 'Toño (correos)'] },
    doc14: { title: 'Hoja escondida del Padre', font: 'pluma', text: 'Lo que no quiero que lean los de la Hermandad:\n\nLos nombres de los que todavía hablaban y me buscaron: en la sacristía, en la calle, en recados por debajo de la puerta. Del confesionario no se escribe nada; eso se queda conmigo. Los que faltan en mi libreta: Nachito, el que barre la plaza. Doña Chelo, la de los tamales. El profe Gudiño. Mi sobrina Lupe.\n\nSi me matan, que alguien los diga en voz alta en un lugar donde se oiga. No un rezo. Un pase de lista.\n\nY el año del candado de abajo es el año en que lo cerraron: el del niño.', names: ['Nachito (el que barre)', 'Doña Chelo (tamales)', 'Profe Gudiño'] },
    doc15: { title: 'Placa de un nicho', font: 'imprenta', text: 'AQUÍ DESCANSAN LOS RESTOS DE\nJ. TRINIDAD GÁLVEZ\nCRISTERO\n† 1928\n"MURIÓ POR CRISTO REY Y POR SU PUEBLO"\n\n(rayado encima con un clavo:) DESPIERTA', names: ['J. Trinidad Gálvez'] },
    doc16: { title: 'Volante de la Hermandad', font: 'imprenta', text: '✝ HERMANDAD DEL SANTO DESPERTAR ✝\nSAHUAYENSE: el pueblo ya despertó. No tengas miedo del que camina y no habla: está corrigiéndose.\nNO prendas luces. NO pongas música. NO digas nombres.\nSi oyes la campana grande, VEN.\nEl Hermano Celso te espera en el cerro.', names: [] },
    doc17: { title: 'Nota del campanero viejo', font: 'pluma', text: 'A quien suba:\nLas campanas se tocan con la cuerda, tres jalones largos, no más, porque la grande está cuarteada desde el temblor.\nDesde el 24 suenan solas y nadie jala nada. Yo me bajé y ya no subo.\nDesde que sacaron la vasija suenan distinto. Como si ya no fueran de bronce. Como si el golpe cayera en un pozo.\nSi las tocas tú, que sea por algo bueno.\n—Chon, campanero desde 1979', names: ['Chon (campanero viejo)'] },
    doc18: { title: 'Cuaderno del taller de huarache', font: 'pluma', text: 'PEDIDOS\n- 40 pares tejidos, para la Hermandad (sin cobrar, dice mi papá)\n- 12 pares para la danza de los tlahualiles (cancelada, se quedan)\n\nMi papá se fue a la procesión con los 40 pares puestos en una lona. No regresó. Dejé la troca prendida para que vea la luz si vuelve de noche.\n—Memo Sandoval', names: ['Memo Sandoval', 'Don Sandoval (huarachero)'] },
    doc19: { title: 'Inscripción en la galería vieja', font: 'imprenta', text: 'ESTOS NICHOS SE VACIARON EN 1931 PARA LLEVAR A LOS NUESTROS ARRIBA, A LA LUZ.\nLO QUE QUEDÓ ABAJO NO ERA NUESTRO.\nNO SE CAVE MÁS ABAJO DE ESTA PIEDRA.\n\n(abajo, con pintura fresca:) Cavamos.', names: [] },
    doc20: { title: 'Guion de la Hermandad para el cerro', font: 'pluma', text: 'ORDEN PARA ESTA NOCHE (Hermano Celso)\n1. Generador apagado. Nada de bocinas: él no quiere ruido que no sea de nosotros.\n2. Campana chica: solo yo la toco.\n3. Nombres prohibidos en la explanada: los de la lista de la Vidente (los que se pueden despertar de a de veras). Si alguien los dice, cencerro largo y se lo llevan abajo.\n4. Decir en voz alta nada más estos: "el Durmiente", "el Despierto", "el Corazón Viejo", "Tzacuatlayotl".\n5. Si él habla, nadie conteste. No es demonio: es más grande que eso, y nosotros somos polvo.', names: [] }

"TESORERÍA MUNICIPAL · RECIBO 00417\nConcepto: donativo voluntario \"Procesión de Desagravio\".\nRecibí de: Hermandad del Santo Despertar.\nCantidad: $48,000.00 (cuarenta y ocho mil pesos). Efectivo.\nObservaciones: \"para veladoras y cencerros\".\n\n(con lápiz:) ¿Quién necesita 48 mil pesos de cencerros?": "MUNICIPAL TREASURY · RECEIPT 00417\nPurpose: voluntary donation, \"Procession of Atonement\".\nReceived from: Brotherhood of the Holy Awakening.\nAmount: $48,000.00 (forty-eight thousand pesos). Cash.\nNotes: \"for candles and cowbells\".\n\n(in pencil:) Who needs 48 thousand pesos' worth of cowbells?",
"DIRECCIÓN DE SEGURIDAD PÚBLICA · PARTE DE NOVEDADES · 12 DE JULIO\n\n22:40 — Reporte de persona agresiva en calle Insurgentes esq. Juárez. Masculino 40 años aprox., camisa de cuadros, \"haciendo ruidos\". Al llegar la unidad 03 el sujeto corrió en cuatro patas (sic). No se logró detención. Vecinos lo identifican como Salvador \"Chava\" Orozco.\n\n23:15 — Vecinos de la col. Santuario reportan campanas del Sagrado Corazón sonando sin personal en el templo. Se verifica: templo cerrado con candado por fuera. Las campanas continuaban.\n\n23:50 — Doña E. (La Vidente) y 30 personas con túnicas en la escalinata de Cristo Rey, subiendo de rodillas. No constituye falta. Se retira la unidad.\n\nOBSERVACIÓN DEL COMANDANTE: Es la quinta noche. Pido instrucciones por escrito. Mis elementos no quieren cubrir el turno de noche. Yo tampoco.\n— Cmte. J. Navarro": "PUBLIC SAFETY DEPARTMENT · INCIDENT REPORT · JULY 12\n\n22:40 — Report of an aggressive person at Insurgentes and Juárez. Male, about 40, plaid shirt, \"making noises\". When unit 03 arrived the subject ran off on all fours (sic). No arrest made. Neighbors identify him as Salvador \"Chava\" Orozco.\n\n23:15 — Residents of the Santuario neighborhood report the bells of the Sagrado Corazón ringing with no one in the church. Verified: church padlocked from the outside. The bells kept ringing.\n\n23:50 — Doña E. (the Seer) and 30 people in robes on the Cristo Rey stairway, climbing on their knees. No offense. Unit withdraws.\n\nCOMMANDER'S NOTE: This is the fifth night. I'm requesting written instructions. My men don't want to cover the night shift. Neither do I.\n— Cmdr. J. Navarro",
"SESIÓN EXTRAORDINARIA DE CABILDO · 18 DE JULIO\nÚnico punto: Festival de las Fiestas de Santiago Apóstol.\n\nEl regidor de Cultura expone que el Festival (escenario en la plaza, 4 noches, patrocinio cervecero) es \"lo que trae gente y dinero\". La regidora de Educación expone que \"la fiesta ya no es de Santiago, es del DJ\", y lee una carta de 412 firmas de la Hermandad del Santo Despertar que exige cancelar.\n\nSe somete a votación: 7 votos a favor de CANCELAR el Festival, 2 en contra.\n\nSe autoriza en su lugar una \"Procesión de Desagravio\" el 24 de julio de la plaza a Cristo Rey, organizada por la Hermandad, \"sin bocinas, sin alcohol, con veladoras\".\n\nEl Presidente Municipal pide que conste en acta que vota a favor \"para que ya se calmen\".\n\n(en el margen, a lápiz:) Se calmaron.": "SPECIAL SESSION OF THE TOWN COUNCIL · JULY 18\nSole item: the Festival of the Feast of Saint James.\n\nThe Culture councilman states that the Festival (stage on the plaza, 4 nights, beer sponsorship) is \"what brings people and money\". The Education councilwoman states that \"the feast isn't Saint James's anymore, it's the DJ's\", and reads a letter with 412 signatures from the Brotherhood of the Holy Awakening demanding it be cancelled.\n\nPut to a vote: 7 votes in favor of CANCELLING the Festival, 2 against.\n\nIn its place, a \"Procession of Atonement\" is authorized for July 24, from the plaza to Cristo Rey, organized by the Brotherhood, \"no speakers, no alcohol, candles only\".\n\nThe Mayor asks that the record show he votes in favor \"so they'll finally calm down\".\n\n(in the margin, in pencil:) They calmed down.",
"Mari:\nNo te vayas a reír. Llevo dos días durmiendo en la oficina porque en la casa se oyen cencerros toda la noche y en la oficina no. O sea sí, pero menos.\n\nAyer fui a la procesión porque era de ley ir. Yo esperaba rezos. Y había rezos, pero también otra cosa que no era español ni latín. Celso lo leía de un cuaderno. Eduviges se reía. Las veladoras no se apagaban con el aire.\n\nSubieron una vasija de barro, grande, como una tortuga, entre ocho. La pusieron frente al Cristo. Y luego todos gritaron \"despierta\" y yo también grité, Mari, porque todos gritaban, y no sé por qué.\n\nDesde entonces no he dormido. Las campanas no paran. Navarro no contesta la radio. Mandé a los muchachos a cerrar el boulevard con las patrullas y no regresaron.\n\nSi lees esto es que no te llamé. No es que no quisiera. Es que ya no sé qué voy a decir cuando abra la boca.\nTe quiero. No vengas.\n—T.": "Mari:\nDon't laugh. I've slept in the office for two nights because at the house you hear cowbells all night long and at the office you don't. Well, you do, but less.\n\nYesterday I went to the procession because I had to. I expected prayers. And there were prayers, but also something else that wasn't Spanish or Latin. Celso read it from a notebook. Eduviges was laughing. The candles didn't go out in the wind.\n\nThey carried up a clay vessel, a big one, shaped like a turtle, eight of them. They set it in front of the Christ. And then everyone shouted \"wake up\" and I shouted too, Mari, because everyone was shouting, and I don't know why.\n\nI haven't slept since. The bells don't stop. Navarro doesn't answer the radio. I sent the boys to close the boulevard with the patrol cars and they didn't come back.\n\nIf you're reading this, it means I didn't call you. Not that I didn't want to. It's that I don't know anymore what I'll say when I open my mouth.\nI love you. Don't come.\n—T.",
"✝ ORACIÓN DEL SANTO DESPERTAR ✝\n(rezar de rodillas, con la veladora en la mano, nueve veces)\n\nDios Padre, que ves a este pueblo dormido en la fiesta y el vicio,\nperdona a Sahuayo, Sodoma de la Ciénega, y corrígelo con tu fuerza.\nQue el que baila, pare. Que el que come, ayune. Que el que grita, calle.\nQue el que se puso máscara, se la quede.\nDespierta, Señor, al que duerme bajo el cerro, y que él los despierte a ellos.\nDESPIERTA, SAHUAYO. Amén.\n\n(a mano:) El Hermano dice que ya está despierto. Que ya no hay que rezar. Que ahora hay que cuidar el rebaño.": "✝ PRAYER OF THE HOLY AWAKENING ✝\n(pray on your knees, candle in hand, nine times)\n\nGod the Father, who sees this town asleep in revelry and vice,\nforgive Sahuayo, Sodom of the Ciénega, and correct it with your strength.\nLet the one who dances, stop. Let the one who eats, fast. Let the one who shouts, fall silent.\nLet the one who put on a mask, keep it.\nAwaken, Lord, the one who sleeps beneath the hill, and let him awaken them.\nWAKE UP, SAHUAYO. Amen.\n\n(handwritten:) The Brother says he's awake now. That there's no need to pray anymore. That now we have to tend the flock.",
"Para quien venga a cubrir el turno:\nNO le abran al del cuarto 7. Lleva tres días sin salir y pide que le lleven el desayuno \"con la campanita\". No tenemos campanita.\nLa llave de la azotea la tiene él. No sé por qué se la di.\n—Yola": "For whoever covers the next shift:\nDo NOT open the door for the man in room 7. He hasn't come out in three days and he asks for his breakfast to be brought \"with the little bell\". We don't have a little bell.\nHe has the roof key. I don't know why I gave it to him.\n—Yola",
"Receta: Clonazepam 2 mg. Paciente: ——. Médico: Dr. ——.\n\n(al reverso, con plumón:)\nYa no surto. Vinieron tres de la Hermandad a decir que las medicinas \"duermen\". Me quitaron el estante completo.\nSi alguien necesita algo, está debajo del mostrador, en la caja de las vendas.\nQue Dios me perdone por lo que les dije.": "Prescription: Clonazepam 2 mg. Patient: ——. Doctor: Dr. ——.\n\n(on the back, in marker:)\nI'm not filling prescriptions anymore. Three from the Brotherhood came to say medicines \"put people to sleep\". They took the whole shelf.\nIf anyone needs something, it's under the counter, in the bandage box.\nGod forgive me for what I said to them.",
"RITO DEL DESPERTAR\n(copiado de la Vidente, que lo copió del sueño)\nI. Se baja a donde están los que murieron por Cristo Rey y se les pide permiso.\nII. Se cava bajo la tercera cruz hasta hallar el corazón viejo del pueblo. (Hallado el 2 de julio. Es una vasija. Tortuga. Pesa como un hombre.)\nIII. Se sube al cerro con el corazón. Cuarenta veladoras por cada año desde que la fiesta se echó a perder: la Vidente dice que fue en el 85. (Hicimos 1,640. Faltaron.)\nIV. Se llama al Durmiente por su nombre viejo tres veces y por su nombre nuevo tres veces.\nV. Se le ofrece lo que el pueblo más quiere: la fiesta. Las máscaras. La comida. El ruido.\nVI. Cuando despierte, nosotros ya estaremos despiertos y los demás se corregirán.\n\n(otra letra:) Punto VI no está pasando como dijo. Los demás no se corrigieron: se quedaron en lo que estaban haciendo. El Hermano dice que eso ES la corrección. Yo ya no sé.\n\n(otra letra, grande:) NO LE DIGAN SU NOMBRE EN VOZ ALTA. VIENE.": "RITE OF AWAKENING\n(copied from the Seer, who copied it from the dream)\nI. Go down to where those who died for Cristo Rey lie, and ask their permission.\nII. Dig beneath the third cross until the town's old heart is found. (Found July 2. It's a vessel. A turtle. Weighs as much as a man.)\nIII. Carry the heart up the hill. Forty candles for every year since the feast went bad: the Seer says that was '85. (We made 1,640. Not enough.)\nIV. Call the Sleeper by his old name three times and by his new name three times.\nV. Offer him what the town loves most: the feast. The masks. The food. The noise.\nVI. When he wakes, we will already be awake and the rest will be corrected.\n\n(another hand:) Point VI isn't happening the way he said. The rest weren't corrected: they stayed stuck in whatever they were doing. The Brother says that IS the correction. I don't know anymore.\n\n(another hand, large:) DON'T SAY HIS NAME OUT LOUD. HE COMES.",
"Yo nomás quería que dejaran de poner la música tan fuerte en la plaza. Eso era todo. Que mi hijo no llegara borracho el 25. Que el padre no tuviera que gritar la misa encima del sonido.\nSe lo pedí a Dios y me contestó otro. Yo creí que era Él porque hablaba bonito.\nAhora el Hermano dice que yo soy santa y me tiene aquí abajo para que no me vaya.\nSi alguien lee esto: no le recen. No lo llamen. Llámenlos a ellos. Por su nombre. Como cuando uno llama a los hijos a cenar. Eso sí lo oyen.\n—Eduviges Hernández, 71 años. Perdón.": "All I wanted was for them to stop playing the music so loud on the plaza. That was all. For my son not to come home drunk on the 25th. For the priest not to have to shout the Mass over the speakers.\nI asked God and someone else answered. I thought it was Him because he spoke so beautifully.\nNow the Brother says I'm a saint and keeps me down here so I won't leave.\nIf anyone reads this: don't pray to him. Don't call him. Call them. By their names. The way you call the kids in for dinner. That, they do hear.\n—Eduviges Hernández, 71. I'm sorry.",
"Cuaderno de pasta dura, letra de cura.\n\nPágina 1. Lo que sé: la cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz. La Hermandad lo llama con campanas. Yo pensé que podía bendecirlo con campanas. Error de viejo.\n\nPágina 2. Lo que vi: los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije \"Lupe\". No \"hija\", no \"mujer\": Lupe. Un segundo. Luego se fue.\n\nPágina 3. Lista: todos los que tú vayas sabiendo. Apúntalos. Los nombres son lo único que no se les olvidó.\n\nPágina 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.": "Hardcover notebook, a priest's handwriting.\n\nPage 1. What I know: the thing below is neither demon nor saint. It is the place. It is the name. It wakes when it's called and sleeps when it's left alone. The Brotherhood calls it with bells. I thought I could bless it with bells. An old man's mistake.\n\nPage 2. What I saw: the possessed answer to their own names. Lupe turned to look at me when I said \"Lupe\". Not \"child\", not \"woman\": Lupe. One second. Then she was gone.\n\nPage 3. The list: everyone you learn of. Write them down. Their names are the one thing they haven't forgotten.\n\nPage 4. Get up somewhere they can all hear you. Ring so they come. And then don't pray at them: name them. One by one. Until they get tired of being awake.",
"HOTEL LATINO · REGISTRO DE HUÉSPEDES · JULIO\n\n19 — Cuarto 3: Sr. Vargas, viajante de huarache. Pagó dos noches.\n21 — Cuarto 7: Rubén Castañeda. \"Es de aquí, pero ya no quiere dormir en su casa\". Pagó una semana. Trae campanitas en una bolsa.\n22 — Cuarto 5: dos muchachos de Jiquilpan que venían al Festival. Se fueron sin pagar cuando les dijeron que se canceló.\n23 — Nadie.\n24 — Nadie. Don Rubén pidió que le subieran el desayuno con la campanita. Yola dijo que no.\n25 — (sin letra; la página está marcada con cera de veladora)": "HOTEL LATINO · GUEST REGISTER · JULY\n\n19 — Room 3: Mr. Vargas, huarache salesman. Paid two nights.\n21 — Room 7: Rubén Castañeda. \"He's from here, but he doesn't want to sleep at his house anymore.\" Paid a week. Carries little bells in a bag.\n22 — Room 5: two young men from Jiquilpan who came for the Festival. Left without paying when they were told it was cancelled.\n23 — Nobody.\n24 — Nobody. Don Rubén asked for his breakfast to be brought up with the little bell. Yola said no.\n25 — (no writing; the page is stained with candle wax)",
"REBAÑO DE CONSTITUCIÓN (a mi cargo)\n- Los dos de la ferretería (hermanos)\n- El muchacho del Oxxo (de noche)\n- Ramiro, el que vendía discos en la plaza\n\nSe llaman con dos cencerradas cortas. Se calman con una larga. Si uno se me va, lo dejo: el Hermano dice que el Durmiente los recoge solo.\nNo bajar de la azotea hasta que salga el sol. El sol ya no sale.": "CONSTITUCIÓN FLOCK (in my charge)\n- The two from the hardware store (brothers)\n- The night kid from the Oxxo\n- Ramiro, the one who sold records on the plaza\n\nCall them with two short cowbell rings. Calm them with one long one. If one gets away, let him go: the Brother says the Sleeper gathers them on his own.\nDon't come down from the roof until the sun comes up. The sun doesn't come up anymore.",
"SERVICIO POSTAL MEXICANO · SUCURSAL SAHUAYO · AVISO\nPor instrucciones superiores (?) no se recibirá ni entregará correspondencia hasta nuevo aviso.\n\n(abajo, a mano, en el reverso de un recibo:)\nCuca: te dejé tu carta de tu hija en el cajón de las estampillas. No la pude entregar porque ya no estabas en el puesto, estabas en el pasillo, parada, diciendo \"qué va a llevar\" sin nadie. Perdóname. Me voy a Jiquilpan a pie.\n—Toño": "MEXICAN POSTAL SERVICE · SAHUAYO BRANCH · NOTICE\nBy orders from above (?) no mail will be received or delivered until further notice.\n\n(below, handwritten on the back of a receipt:)\nCuca: I left the letter from your daughter in the stamp drawer. I couldn't deliver it because you weren't at your stall anymore, you were in the aisle, standing there, saying \"what'll you have\" to no one. Forgive me. I'm walking to Jiquilpan.\n—Toño",
"Lo que no quiero que lean los de la Hermandad:\n\nLos nombres de los que todavía hablaban y me buscaron: en la sacristía, en la calle, en recados por debajo de la puerta. Del confesionario no se escribe nada; eso se queda conmigo. Los que faltan en mi libreta: Nachito, el que barre la plaza. Doña Chelo, la de los tamales. El profe Gudiño. Mi sobrina Lupe.\n\nSi me matan, que alguien los diga en voz alta en un lugar donde se oiga. No un rezo. Un pase de lista.\n\nY el año del candado de abajo es el año en que lo cerraron: el del niño.": "What I don't want the Brotherhood to read:\n\nThe names of those who could still speak and came looking for me: in the sacristy, in the street, in notes slipped under the door. Nothing from the confessional gets written down; that stays with me. The ones missing from my notebook: Nachito, who sweeps the plaza. Doña Chelo, the tamale lady. Professor Gudiño. My niece Lupe.\n\nIf they kill me, let someone say them out loud somewhere they can be heard. Not a prayer. A roll call.\n\nAnd the year on the lock down below is the year they closed it: the boy's year.",
"AQUÍ DESCANSAN LOS RESTOS DE\nJ. TRINIDAD GÁLVEZ\nCRISTERO\n† 1928\n\"MURIÓ POR CRISTO REY Y POR SU PUEBLO\"\n\n(rayado encima con un clavo:) DESPIERTA": "HERE LIE THE REMAINS OF\nJ. TRINIDAD GÁLVEZ\nCRISTERO\n† 1928\n\"HE DIED FOR CHRIST THE KING AND FOR HIS PEOPLE\"\n\n(scratched over it with a nail:) DESPIERTA — wake up",
"✝ HERMANDAD DEL SANTO DESPERTAR ✝\nSAHUAYENSE: el pueblo ya despertó. No tengas miedo del que camina y no habla: está corrigiéndose.\nNO prendas luces. NO pongas música. NO digas nombres.\nSi oyes la campana grande, VEN.\nEl Hermano Celso te espera en el cerro.": "✝ BROTHERHOOD OF THE HOLY AWAKENING ✝\nPEOPLE OF SAHUAYO: the town has awakened. Don't fear the one who walks and doesn't speak: he is being corrected.\nDo NOT turn on lights. Do NOT play music. Do NOT say names.\nIf you hear the big bell, COME.\nBrother Celso awaits you on the hill.",
"A quien suba:\nLas campanas se tocan con la cuerda, tres jalones largos, no más, porque la grande está cuarteada desde el temblor.\nDesde el 24 suenan solas y nadie jala nada. Yo me bajé y ya no subo.\nDesde que sacaron la vasija suenan distinto. Como si ya no fueran de bronce. Como si el golpe cayera en un pozo.\nSi las tocas tú, que sea por algo bueno.\n—Chon, campanero desde 1979": "To whoever comes up:\nThe bells are rung with the rope, three long pulls, no more, because the big one has been cracked since the earthquake.\nSince the 24th they ring on their own and nobody pulls anything. I came down and I'm not going back up.\nSince they took the vessel out they sound different. As if they weren't bronze anymore. As if the blow fell down a well.\nIf you ring them, let it be for something good.\n—Chon, bell-ringer since 1979",
"PEDIDOS\n- 40 pares tejidos, para la Hermandad (sin cobrar, dice mi papá)\n- 12 pares para la danza de los tlahualiles (cancelada, se quedan)\n\nMi papá se fue a la procesión con los 40 pares puestos en una lona. No regresó. Dejé la troca prendida para que vea la luz si vuelve de noche.\n—Memo Sandoval": "ORDERS\n- 40 woven pairs, for the Brotherhood (no charge, my dad says)\n- 12 pairs for the tlahualil dance (cancelled, they stay)\n\nMy dad went to the procession with the 40 pairs laid out on a tarp. He didn't come back. I left the pickup running so he sees the lights if he comes back at night.\n—Memo Sandoval",
"ESTOS NICHOS SE VACIARON EN 1931 PARA LLEVAR A LOS NUESTROS ARRIBA, A LA LUZ.\nLO QUE QUEDÓ ABAJO NO ERA NUESTRO.\nNO SE CAVE MÁS ABAJO DE ESTA PIEDRA.\n\n(abajo, con pintura fresca:) Cavamos.": "THESE NICHES WERE EMPTIED IN 1931 TO CARRY OUR OWN UP, INTO THE LIGHT.\nWHAT STAYED BELOW WAS NOT OURS.\nDIG NO DEEPER THAN THIS STONE.\n\n(below, in fresh paint:) We dug.",
"ORDEN PARA ESTA NOCHE (Hermano Celso)\n1. Generador apagado. Nada de bocinas: él no quiere ruido que no sea de nosotros.\n2. Campana chica: solo yo la toco.\n3. Nombres prohibidos en la explanada: los de la lista de la Vidente (los que se pueden despertar de a de veras). Si alguien los dice, cencerro largo y se lo llevan abajo.\n4. Decir en voz alta nada más estos: \"el Durmiente\", \"el Despierto\", \"el Corazón Viejo\", \"Tzacuatlayotl\".\n5. Si él habla, nadie conteste. No es demonio: es más grande que eso, y nosotros somos polvo.": "ORDERS FOR TONIGHT (Brother Celso)\n1. Generator off. No speakers: he wants no noise that isn't ours.\n2. Small bell: only I ring it.\n3. Names forbidden on the esplanade: the ones on the Seer's list (the ones who can truly be woken). If anyone says them, one long cowbell and they're taken below.\n4. Say out loud only these: \"the Sleeper\", \"the Awakened\", \"the Old Heart\", \"Tzacuatlayotl\".\n5. If he speaks, nobody answer. He's no demon: he's bigger than that, and we are dust.",
"La central de autobuses. Horario pegado en el vidrio con cinta. Adentro, un autobús con la puerta abierta y las luces de cabina prendidas. Nadie.": "The bus station. A timetable taped to the glass. Inside, a bus with its door open and the cabin lights on. Nobody.",
"Pintado con aerosol rojo, con letra de alguien que no sabe pintar: DESPIERTA SAHUAYO. Debajo, más chiquito: \"ya\".": "Sprayed in red, in the hand of someone who can't paint: DESPIERTA SAHUAYO. Wake up, Sahuayo. Underneath, smaller: \"ya\". Now.",
"PRESIDENCIA MUNICIPAL · SAHUAYO DE MORELOS · \"Progreso, Justicia, Patria\". La placa tiene veladoras derretidas abajo.": "CITY HALL · SAHUAYO DE MORELOS · \"Progress, Justice, Homeland\". Melted candles under the plaque.",
"El mural de Sahuayo: tlahualiles, huaraches, las torres de la parroquia, Cristo Rey en el cerro. Está nuevo. Está bonito. Alguien le rayó los ojos a todas las caras.": "The Sahuayo mural: tlahualil dancers, huaraches, the church towers, Cristo Rey on the hill. It's new. It's pretty. Someone scratched the eyes out of every face.",
"TESORERÍA MUNICIPAL · Horario 9:00 a 15:00 · \"No se aceptan cheques\".": "MUNICIPAL TREASURY · Hours 9:00 to 15:00 · \"No checks accepted\".",
"REGISTRO CIVIL · Nacimientos, matrimonios, defunciones. La ventanilla de defunciones tiene una fila de veladoras.": "CIVIL REGISTRY · Births, marriages, deaths. The deaths window has a row of candles.",
"SALA DE CABILDO. Las sillas están todas volteadas hacia la ventana, como si hubieran estado viendo algo afuera.": "COUNCIL CHAMBER. The chairs are all turned toward the window, as if they'd been watching something outside.",
"DIRECCIÓN DE SEGURIDAD PÚBLICA. En el pizarrón: \"TURNO NOCHE: nadie\". Y abajo, con otra letra: \"ya no hace falta\".": "PUBLIC SAFETY DEPARTMENT. On the whiteboard: \"NIGHT SHIFT: nobody\". And below, in another hand: \"no longer needed\".",
"OFICINA DEL C. PRESIDENTE MUNICIPAL. La puerta tiene una hoja clavada con una tachuela.": "OFFICE OF THE MAYOR. A sheet of paper tacked to the door.",
"HOTEL LATINO · 5 PISOS · \"Confort y tradición\". La cortina está arriba y el letrero de NO HAY CUARTOS, prendido.": "HOTEL LATINO · 5 FLOORS · \"Comfort and tradition\". The shutter is up and the NO VACANCY sign is lit.",
"FARMACIA ROMA · Constitución 212. La vitrina rota desde adentro. En el vidrio, con plumón: \"Las medicinas DUERMEN. No surtimos\".": "FARMACIA ROMA · Constitución 212. The window broken from the inside. On the glass, in marker: \"Medicines put you to SLEEP. We don't fill prescriptions\".",
"OFICINA DE CORREOS, en medio del mercado. La ventanilla cerrada. Un cajón entreabierto con estampillas.": "POST OFFICE, in the middle of the market. The window shut. A half-open drawer of stamps.",
"Carnicería \"La Michoacana\". Focos rojos prendidos, nada colgado de los ganchos. Las moscas sí.": "Butcher shop \"La Michoacana\". Red lights on, nothing hanging from the hooks. The flies are still here.",
"Puesto de fritangas. Las carnitas en el cazo, frías, con una costra de manteca blanca. Todavía huele.": "A fried-food stall. The carnitas in the pot, cold, under a crust of white lard. It still smells.",
"El retablo dorado. Santiago Apóstol a caballo. Alguien le quitó la espada y le puso un cencerro en la mano.": "The gilded altarpiece. Saint James on horseback. Someone took his sword and put a cowbell in his hand.",
"La capilla del niño mártir. Exvotos, fotos, un huarachito de bronce, gallos de yeso. Todo intacto. Es el único lugar limpio de la ciudad.": "The boy martyr's chapel. Votive offerings, photos, a little bronze huarache, plaster roosters. All untouched. It's the only clean place in town.",
"El baptisterio. Placa: \"Aquí estuvo preso el niño mártir en 1928\". La puerta tiene llave nueva.": "The baptistery. Plaque: \"The boy martyr was held prisoner here in 1928\". The door has a new lock.",
"La sacristía. Casullas colgadas, un cáliz, y en el piso una trampilla con una argolla de hierro.": "The sacristy. Vestments on hooks, a chalice, and in the floor a trapdoor with an iron ring.",
"La galería inundada. El agua hasta la rodilla, fría, con olor a cantera. Cada paso suena en todo el túnel.": "The flooded gallery. Water up to the knee, cold, smelling of quarry stone. Every step echoes down the whole tunnel.",
"Un derrumbe. Tabique y tierra hasta el techo. Hay que rodear.": "A cave-in. Brick and dirt up to the ceiling. Have to go around.",
"La sala museo. Esculturas de yeso de santos y mártires, sin terminar, con la malla de alambre asomando. La escalera baja a las catacumbas.": "The museum room. Plaster statues of saints and martyrs, unfinished, the wire mesh showing through. The stairs go down to the catacombs.",
"El coro. Un piano vertical con la tapa abierta. En el atril, un himno a lápiz: \"Despierta, Sahuayo\" en vez de \"Despierta, pecador\".": "The choir loft. An upright piano with the lid open. On the stand, a hymn in pencil: \"Wake up, Sahuayo\" instead of \"Wake up, sinner\".",
"La puerta de la torre. Arriba, las campanas grandes. Suenan solas desde el 24.": "The tower door. Up there, the big bells. Ringing on their own since the 24th.",
"Las tres campanas del Sagrado Corazón. La grande, cuarteada. Las cuerdas bajan hasta el piso de abajo.": "The three bells of the Sagrado Corazón. The big one, cracked. The ropes run down to the floor below.",
"Placa en el atrio: \"En este lugar fueron fusilados 27 cristeros\". Veladoras nuevas debajo, prendidas.": "Plaque in the atrium: \"On this spot 27 cristeros were executed by firing squad\". New candles under it, lit.",
"Taller de huarache. Hormas colgadas, tiras de cuero, una radio con estática. Nadie.": "A huarache workshop. Hanging lasts, strips of leather, a radio hissing static. Nobody.",
"CALLE PADRE J. LUIS ARREGUI. Casas bajas, talleres. Al fondo baja al arroyo.": "PADRE J. LUIS ARREGUI STREET. Low houses, workshops. At the end it drops to the creek.",
"Puente de concreto sobre El Infiernito. Alguien pintó en la barda: \"AQUÍ NO HAY INFIERNO, ES NOMÁS AGUA\".": "Concrete bridge over El Infiernito, \"the little hell\". Someone painted on the wall: \"THERE'S NO HELL HERE, IT'S JUST WATER\".",
"Nichos vacíos. Las placas arrancadas. Esta galería es más vieja que las de arriba.": "Empty niches. The plaques torn off. This gallery is older than the ones above.",
"La vasija. Enorme, enterrada hasta la mitad, con forma de tortuga. El barro está tibio. El piso sube y baja, despacio, como si respirara.": "The vessel. Enormous, buried halfway, shaped like a turtle. The clay is warm. The floor rises and falls, slowly, as if it were breathing.",
"Cuarto de máquinas. Un generador, un amplificador viejo y un micrófono con cable. Las bocinas de trompeta apuntan al pueblo.": "Machine room. A generator, an old amplifier and a wired microphone. The horn speakers point at the town.",
"La capilla de Cristo Rey, debajo de la explanada, entre las dos escaleras. Chiquita, de piedra. Una campana chica en la pared.": "The Cristo Rey chapel, under the esplanade, between the two stairways. Tiny, made of stone. A small bell on the wall.",
"Cuarto 7. Campanitas en una bolsa, una veladora, la cama sin deshacer.": "Room 7. Little bells in a bag, a candle, the bed still made.",
"Reja de metal.": "A metal grille.",
"Tianguis de llantas. \"Instalación gratis\". Una llanta rodó hasta media calle.": "Tire market. \"Free installation\". One tire rolled halfway into the street.",
"Clínica. Luz prendida adentro. Nadie en recepción.": "A clinic. Lights on inside. Nobody at reception.",
"Roca húmeda.": "Wet rock.",
"Banco. El cajero repite \"RETIRE SU TARJETA\" en la pantalla, sin tarjeta.": "A bank. The ATM screen keeps saying \"REMOVE YOUR CARD\", with no card in it.",
"Los portales de la Presidencia. Cantera rosa, balcones verdes, el reloj parado en las 11:52.": "The City Hall arcades. Pink quarry stone, green balconies, the clock stopped at 11:52.",
"Valla de la Policía Municipal. \"Cerrado por seguridad\". ¿Seguridad de quién?": "Municipal Police barricade. \"Closed for safety\". Whose safety?",
"Arcos del patio. Pintas de sombras de veladoras en la cantera.": "Courtyard arches. Candle-smoke shadows stained into the stone.",
"Madera oscura y retratos de presidentes municipales. A todos les tacharon la cara.": "Dark wood and portraits of past mayors. Every face has been crossed out.",
"Una pared.": "A wall.",
"Una casa. Cortina abajo, luz apagada. Nadie abre.": "A house. Shutter down, lights off. Nobody answers.",
"Pared.": "Wall.",
"La Parroquia de Santiago Apóstol. Cantera, torres, cúpula roja.": "The church of Santiago Apóstol. Quarry stone, towers, red dome.",
"Piedra de la torre.": "Tower stone.",
"Cantera. Fría.": "Quarry stone. Cold.",
"Tabique viejo. Húmedo.": "Old brick. Damp.",
"Un nicho con su placa.": "A niche with its plaque.",
"Lámina del mercado.": "The market's sheet metal.",
"La pared del hotel, naranja.": "The hotel wall, orange.",
"Farmacia Roma.": "Farmacia Roma.",
"El kiosco de hierro de la plaza.": "The plaza's iron bandstand.",
"Un carro atravesado.": "A car blocking the way.",
"Encadenado. Por aquí no.": "Chained. Not this way.",
"Cerrado con llave.": "Locked.",
"Un carro.": "A car.",
"Un carro con las puertas abiertas. Las llaves puestas.": "A car with the doors open. Keys in the ignition.",
"Un carro. Adentro, en el asiento, un cencerro.": "A car. Inside, on the seat, a cowbell.",
"Basura.": "Trash.",
"Bolsas de basura regadas. Sigue habiendo muchos marranitos, al parecer.": "Trash bags scattered around. Still plenty of pigs in this town, apparently.",
"Basura. Botellas de la fiesta del año pasado, todavía.": "Trash. Bottles from last year's feast, still.",
"Zapatos en fila sobre la banqueta. De varios tamaños. Como si se los hubieran quitado para entrar a algún lado.": "Shoes lined up on the sidewalk. Different sizes. As if people had taken them off to go in somewhere.",
"Un carrito de súper en medio del boulevard. Lleno de veladoras nuevas, en su caja.": "A shopping cart in the middle of the boulevard. Full of new candles, still boxed.",
"Patrulla de la Policía Municipal. La torreta prendida, el radio chasqueando solo. Nadie.": "A Municipal Police patrol car. Lights flashing, the radio crackling on its own. Nobody.",
"Un autobús de pasajeros. La puerta abierta, las luces de cabina prendidas, la tele con estática. Un boleto en el escalón: Guadalajara–Sahuayo, 5:40.": "A passenger bus. Door open, cabin lights on, the TV showing static. A ticket on the step: Guadalajara–Sahuayo, 5:40.",
"El Tsuru del Chuche. Muerto. Ni los faros. Ni el radio. Ni modo. En el espejo, las llaves de la casa de mi mamá.": "Chuche's Tsuru. Dead. No headlights. No radio. Oh well. Hanging from the mirror, the keys to my mom's house.",
"Una lámpara. Parpadea. Zumba.": "A streetlight. It flickers. It hums.",
"Lámpara del boulevard, de dos brazos. Un brazo prendido, el otro no.": "A two-armed boulevard lamp. One arm lit, the other not.",
"Una palmera del camellón. Alguien le amarró listones negros.": "A palm tree on the median. Someone tied black ribbons to it.",
"Una jacaranda. Todavía con flor, fuera de temporada.": "A jacaranda. Still in bloom, out of season.",
"El obelisco del camellón, de cantera rosa. La placa está tapada con cera de veladora.": "The median's obelisk, pink quarry stone. The plaque is covered in candle wax.",
"Las letras SAHUAYO del parquecito. A la O le falta la mitad.": "The big SAHUAYO letters in the little park. Half the O is missing.",
"Un ficus del camellón. Alguien le colgó cencerros.": "A ficus on the median. Someone hung cowbells on it.",
"Una banca. Vacía.": "A bench. Empty.",
"La fuente del patio, seca. Monedas al fondo. Y una muela.": "The courtyard fountain, dry. Coins at the bottom. And a molar.",
"Un escritorio. Papeles, un café frío, una foto familiar boca abajo.": "A desk. Papers, a cold coffee, a family photo face down.",
"Una silla.": "A chair.",
"Una rata. Muerta. Mordida.": "A rat. Dead. Bitten.",
"La estatua del tlahualil de la plaza. Alguien le pintó la máscara de negro.": "The plaza's tlahualil statue. Someone painted its mask black.",
"El huarache más grande del mundo. Récord Guinness. Lo dice la placa.": "The world's biggest huarache. Guinness record. Says so on the plaque.",
"Un puesto del mercado. La lona abajo, la mercancía intacta, un radio con estática.": "A market stall. Tarp down, the goods untouched, a radio hissing static.",
"El mostrador.": "The counter.",
"Estantes vacíos. Les quitaron todo lo que \"duerme\".": "Empty shelves. They took everything that \"puts you to sleep\".",
"Una cama de hotel, tendida. Nadie durmió aquí.": "A hotel bed, made. Nobody slept here.",
"El sillón de la recepción. Un periódico del jueves 23 de julio de 2026.": "The lobby couch. A newspaper from Thursday, July 23, 2026.",
"Una planta de plástico.": "A plastic plant.",
"La tele de la recepción, con estática.": "The lobby TV, showing static.",
"Tinaco.": "A water tank.",
"La antena del hotel. Un cencerro amarrado arriba, se mueve con el aire.": "The hotel antenna. A cowbell tied to the top, swinging in the wind.",
"Ropa tendida. Túnicas de manta, mojadas.": "Laundry on the line. Cotton robes, wet.",
"Una banca de iglesia. Rayada con uñas.": "A church pew. Scratched with fingernails.",
"El altar. Veladoras, flores secas.": "The altar. Candles, dried flowers.",
"Un cirio. Prendido.": "A tall candle. Lit.",
"Exvotos: fotos de bebés, un huarache de bronce, una pulsera de hospital.": "Votive offerings: baby photos, a bronze huarache, a hospital bracelet.",
"Un gallo de yeso, pintado. Parte de la memoria del lugar.": "A painted plaster rooster. Part of this place's memory.",
"La pila bautismal, de cantera. Seca.": "The baptismal font, quarry stone. Dry.",
"Un mantel de altar tapando a alguien. No lo levantes.": "An altar cloth covering someone. Don't lift it.",
"La trampilla a las catacumbas.": "The trapdoor to the catacombs.",
"Placa de un nicho. Nombre, fecha, \"murió por Cristo Rey\".": "A niche plaque. Name, date, \"died for Christ the King\".",
"Réplica de la vasija, de barro, con forma de tortuga. Chiquita. La real está más abajo.": "A clay replica of the vessel, turtle-shaped. Small. The real one is further down.",
"Pintura fresca en la pared: DESPIERTA. Todavía escurre.": "Fresh paint on the wall: DESPIERTA. Wake up. Still dripping.",
"Escombro.": "Rubble.",
"Escalera hacia arriba.": "Stairs going up.",
"Escalera hacia abajo.": "Stairs going down.",
"Un piano vertical. La tapa abierta.": "An upright piano. The lid open.",
"Una ventana de la torre. Abajo, el pueblo en niebla. Por la calle viene gente, despacio.": "A tower window. Below, the town in fog. People coming up the street, slowly.",
"Las campanas grandes. La cuerda cuelga hasta abajo.": "The big bells. The rope hangs all the way down.",
"La cuerda de las campanas.": "The bell rope.",
"Flores secas.": "Dried flowers.",
"Escultura de yeso sin terminar. La malla asoma por el hombro.": "An unfinished plaster statue. The wire mesh shows through at the shoulder.",
"Hormas de madera colgadas en fila.": "Wooden shoe lasts hanging in a row.",
"La troca. Motor encendido, faros prendidos, nadie.": "The pickup. Engine running, headlights on, nobody.",
"Una llanta en el agua.": "A tire in the water.",
"Carrizo.": "Reeds.",
"Una cruz de hierro oxidada clavada en la roca.": "A rusted iron cross driven into the rock.",
"Goteo.": "Dripping.",
"La vasija. Enorme. Tibia. El piso respira.": "The vessel. Enormous. Warm. The floor breathes.",
"Un número rayado en la pared: escalones.": "A number scratched into the wall: steps.",
"El pedestal de Cristo Rey. Quince metros de piedra y arriba la estatua con los brazos abiertos, mirando a la Ciénega.": "The Cristo Rey pedestal. Fifteen meters of stone and, on top, the statue with open arms, looking out over the Ciénega.",
"Una estación del vía crucis en mosaico. Intacta.": "A Station of the Cross in mosaic. Untouched.",
"Bocina de trompeta apuntando al pueblo.": "A horn speaker pointed at the town.",
"El campanario de piedra volcánica, con sus tres campanas y las bocinas amarradas.": "The volcanic-stone bell tower, with its three bells and the speakers strapped to it.",
"Generador de gasolina.": "A gas generator.",
"Amplificador viejo, de los de bulbos.": "An old amplifier, the tube kind.",
"El micrófono. Con cable.": "The microphone. Wired.",
"Escalera de caracol.": "A spiral staircase.",
"El tablero de llaves de la recepción. Faltan la 7 y la de la azotea.": "The key board at the front desk. Number 7 and the roof key are missing.",
"Pan del mercado. Duro, pero pan.": "Bread from the market. Stale, but bread.",
"La llave del cuarto 7, con su llavero de madera. Colgada aparte de las demás.": "The key to room 7, with its wooden tag. Hanging apart from the others.",
"Llave con etiqueta: AZOTEA. Estaba en la mesa de noche del cuarto 7.": "A key tagged ROOF. It was on the nightstand in room 7.",
"Cuarto 7. Cerrado con llave. Del otro lado alguien respira pegado a la puerta.": "Room 7. Locked. On the other side someone is breathing right against the door.",
"Puerta de la azotea. Cerrada. Arriba suena un cencerro, despacio, como llamando.": "The roof door. Locked. Up there a cowbell rings, slowly, like a call.",
"La caja de las vendas. Debajo del mostrador, como decía la nota. Pesa.": "The bandage box. Under the counter, like the note said. It's heavy.",
"Un diablito de carga, de los de bultos. Pesado, pero rueda.": "A hand truck, the kind for hauling sacks. Heavy, but it rolls.",
"La reja del mercado hacia Sahagún. Tiene un boquete abajo, pero alguien atoró un carrito. Con un diablito se podría palanquear.": "The market gate onto Sahagún. There's a gap at the bottom, but someone jammed a cart in it. A hand truck could pry it loose.",
"El baptisterio. Cerrado con llave desde hace mucho. En la puerta, una placa: \"Aquí estuvo preso el niño mártir\".": "The baptistery. Locked for a long time. On the door, a plaque: \"The boy martyr was held prisoner here\".",
"Detrás del altar, una cajita de balas envuelta en un pañuelo con iniciales.": "Behind the altar, a little box of bullets wrapped in a monogrammed handkerchief.",
"Un rifle Máuser oxidado, del 28. Pesa como un recuerdo.": "A rusted Mauser rifle, from '28. Heavy as a memory.",
"El Cristero": "The Cristero",
"Un hombre sentado en su nicho, con sombrero, sin rifle. Levanta la mano como pidiendo algo que le falta.": "A man sitting in his niche, with a hat, without his rifle. He raises his hand as if asking for something he's missing.",
"Una puerta de hierro con candado de combinación de cuatro números. Arriba, grabado: \"EL AÑO EN QUE SE CERRÓ\".": "An iron door with a four-digit combination lock. Engraved above it: \"THE YEAR IT WAS CLOSED\".",
"Una cabeza de muñeca, de las de plástico duro, en el asiento de la troca. Los ojos se le mueven.": "A doll's head, the hard plastic kind, on the pickup's seat. Its eyes move.",
"La troca con el motor encendido. Nadie adentro. La puerta está abierta: en el asiento, una cabeza de muñeca.": "The pickup with the engine running. Nobody inside. The door is open: on the seat, a doll's head.",
"La niña del río": "The girl in the river",
"Una niña parada en el agua con una muñeca sin cabeza. No dice nada. Mueve la muñeca como si la meciera.": "A girl standing in the water with a headless doll. She says nothing. She moves the doll as if rocking it.",
"Una veladora de las grandes, nueva, con cerillos pegados con cinta. Alguien la dejó aquí a propósito.": "One of the big candles, new, with matches taped to it. Someone left it here on purpose.",
"Un bidón de gasolina a medias, junto a la jardinera. Alguien lo usó para las lámparas.": "A half-full gas can, by the planter. Someone used it for the lamps.",
"Caja de interruptores del sistema de audio. Sin luz, no sirve.": "The sound system's breaker box. No power, no use.",
"La señora de la veladora": "The woman with the candle",
"Hotel Latino · recepción": "Hotel Latino · front desk",
"Hotel Latino · planta alta": "Hotel Latino · upper floor",
"Hotel Latino · azotea": "Hotel Latino · roof",
"Farmacia Roma": "Farmacia Roma",
"Mercado Morelos": "Morelos market",
"Parroquia de Santiago Apóstol": "Santiago Apóstol church",
"Parroquia del Sagrado Corazón": "Sagrado Corazón church",
"Torre del Sagrado Corazón": "Sagrado Corazón tower",
"Calle Padre J. Luis Arregui": "Padre J. Luis Arregui street",
"La cueva": "The cave",
"La sala del Ayotl": "The Ayotl chamber",
"La escalera de piedra": "The stone stairs",
"¿Qué chingados...?": "What the hell...?",
"...Ora webos. ¿Qué chingados traes ahí?": "...Whoa, whoa. What the hell have you got there?",
"...¿Qué chingados?": "...What the hell?",
"(respira) Está vivo. Está... respirando. Con los ojos abiertos.": "(breathes) He's alive. He's... breathing. Eyes open.",
"La Presidencia está ahí en la contraesquina. Deja voy a ver si hay algún poli, pa que luego no me la hagan de pedo.": "City Hall's right there on the corner. Let me see if there's a cop, so nobody gives me grief about this later.",
"Cerrada con cadena. Claro. La de Guerrero, entonces.": "Chained shut. Of course. The Guerrero door, then.",
"Luz de emergencia. Papeles en el piso. Huele a veladora.": "Emergency lights. Papers on the floor. Smells like candles.",
"¿Hay alguien? ...Soy civil, eh.": "Anybody here? ...I'm a civilian, okay?",
"Un poli. Sentado, de espaldas. Con el radio en la mano.": "A cop. Sitting with his back to me. Radio in hand.",
"...Mejor no le hablo de frente.": "...Better not approach him head-on.",
"Una macana. Reglamentaria. Me la llevo prestada; luego la devuelvo.": "A nightstick. Standard issue. I'm borrowing it; I'll give it back later.",
"La pistola del comandante. Cinco balas. Me tiemblan las manos nomás de agarrarla.": "The commander's pistol. Five bullets. My hands shake just holding it.",
"El radio del comandante. Puro chasquido... pero chasquea más cuando hay alguien cerca. Me lo quedo.": "The commander's radio. Nothing but static... but it crackles more when someone's near. I'm keeping it.",
"...No. Esto no es una borrachera. Esto no es nada que yo conozca.": "...No. This isn't a bender. This isn't anything I know.",
"Desde el balcón se ve Constitución hasta donde la niebla deja. Y en la niebla, una fila de gente caminando despacio hacia la plaza. Con campanitas.": "From the balcony you can see Constitución as far as the fog allows. And in the fog, a line of people walking slowly toward the plaza. With little bells.",
"Ya deberían ser las luces. Y nada: la niebla, y lo mismo de oscuro. Vamos a la plaza, pues. A ver qué queda.": "It should be getting light by now. And nothing: the fog, and just as dark. To the plaza, then. Let's see what's left.",
"...Perdón. Perdón, oficial.": "...Sorry. Sorry, officer.",
"Clic izquierdo o F: golpear. Cada golpe gasta AIRE. Si te quedas sin aire, pegas a la mitad. Shift para correr (también gasta).": "Left click or F: hit. Every hit uses BREATH. Out of breath, you hit at half strength. Shift to run (uses it too).",
"Veladora apagada. Prenderla (E) guarda tu progreso. Si te chuchean, vuelves aquí.": "An unlit candle. Lighting it (E) saves your progress. If they get you, you come back here.",
"Sin balas.": "No bullets.",
"Nada. Un rosario y chicles.": "Nothing. A rosary and some gum.",
"Balas. Perdón, oficial.": "Bullets. Sorry, officer.",
"La última vez que vi este boulevard vacío fue en el 2011. Esa noche también. Por otra cosa.": "The last time I saw this boulevard empty was in 2011. That night too. For a different reason.",
"CAPÍTULO 1 COMPLETADO": "CHAPTER 1 COMPLETE",
"CAPÍTULO 2 COMPLETADO": "CHAPTER 2 COMPLETE",
"CAPÍTULO 3 COMPLETADO": "CHAPTER 3 COMPLETE",
"CAPÍTULO 4 COMPLETADO": "CHAPTER 4 COMPLETE",
"CAPÍTULO 5 COMPLETADO": "CHAPTER 5 COMPLETE",
"CAPÍTULO 6 COMPLETADO": "CHAPTER 6 COMPLETE",
"CAPÍTULO 7 COMPLETADO": "CHAPTER 7 COMPLETE",
"Constitución pa abajo, hasta la plaza. Tres cuadras. Caminando con mi abuela eran diez minutos.": "Down Constitución to the plaza. Three blocks. Walking with my grandma it took ten minutes.",
"El Hotel Latino. Cinco pisos. Y desde la azotea un cencerro, despacio, como llamando a alguien.": "The Hotel Latino. Five floors. And from the roof a cowbell, slow, like it's calling someone.",
"...¿Esos son perros? No ladran. Van con las manos.": "...Are those dogs? They don't bark. They're going on their hands.",
"El del cencerro los trae. Si se calla el cencerro, a lo mejor se van.": "The one with the cowbell is driving them. If the cowbell stops, maybe they'll leave.",
"Se calló el cencerro.": "The cowbell stopped.",
"...Abajo ya no se oyen. Perdón, hermano. O lo que fueras.": "...Can't hear them down there anymore. Sorry, brother. Or whatever you were.",
"Quince años y la Roma sigue abriendo a las ocho. Bueno. Abría.": "Fifteen years and the Roma still opens at eight. Well. Opened.",
"El Nievero. El mismo carrito. Y la campana sonando sola.": "The ice cream man. The same cart. And the bell ringing on its own.",
"El fantasma señala la campana del carrito. Golpéala (F) para callarla.": "The ghost points at the cart's bell. Hit it (F) to silence it.",
"...Gracias, don. De limón, la próxima.": "...Thanks, don. Lime, next time.",
"La plaza llena un domingo a las seis de la mañana. Y nadie habla.": "The plaza full on a Sunday at six in the morning. And nobody talks.",
"Están viendo la Parroquia. Todos. Mejor no me les acerco.": "They're staring at the church. All of them. Better not get close.",
"La reja con cadena y dos carros atravesados. Por el Mercado, pues: la puerta de Sahagún.": "The gate chained and two cars across it. Through the market, then: the Sahagún door.",
"El Mercado. Huele a fritanga fría y a focos rojos. Alguien dice \"qué va a llevar\" sin que haya nadie.": "The market. Smells like cold fried food and red light bulbs. Someone's saying \"what'll you have\" with nobody there.",
"Ese señor... está hinchado. Como si hubiera comido tres días seguidos sin parar. No se mete por los pasillos: mejor.": "That man... he's swollen. Like he ate three days straight without stopping. He can't get down the aisles: good.",
"La reja a Sahagún. Un boquete abajo y un carrito atorado. Con el diablito de los bultos la palanqueo.": "The gate to Sahagún. A gap at the bottom and a cart jammed in it. I'll pry it with the sack hand truck.",
"Ya. Sahagún. La puerta de la Parroquia está ahí enfrente.": "Done. Sahagún. The church door is right across.",
"Aquí me bautizaron. Aquí lo tuvieron al niño. Yo venía con mi abuela.": "This is where I was baptized. This is where they held the boy. I used to come with my grandma.",
"Las veladoras prendidas. Alguien sigue aquí.": "The candles are lit. Someone's still here.",
"¿Liobas? ¿El de doña Chuy? Dios mío. Pasa, pasa, cierra.": "Liobas? Doña Chuy's boy? Dear God. Come in, come in, close the door.",
"Padre, ¿qué pasó aquí?": "Father, what happened here?",
"Lo que pasa cuando la gente reza enojada. Eran de aquí. Rosario de los jueves. Buenas personas, hijo, no te voy a decir que no. Y de repente la fiesta les dio asco.": "What happens when people pray angry. They were from here. The Thursday rosary group. Good people, son, I won't tell you otherwise. And suddenly the feast disgusted them.",
"\"Sodoma\", decían. \"Sahuayo duerme.\" Yo pensé: es la edad, se les pasa.": "\"Sodom,\" they said. \"Sahuayo sleeps.\" I thought: it's their age, it'll pass.",
"¿Y luego?": "And then?",
"Luego empezaron a subir el cerro de rodillas. Luego a cavar abajo del Sagrado Corazón. Dijeron que habían encontrado \"el corazón viejo del pueblo\". Una vasija. Una tortuga.": "Then they started climbing the hill on their knees. Then digging under the Sagrado Corazón. They said they'd found \"the town's old heart\". A vessel. A turtle.",
"Dicen que es el nombre viejo del pueblo. Tzacuatlayotl: la vasija, la tortuga. Quién sabe si Sahuayo se llamó así alguna vez, hijo.": "They say it's the town's old name. Tzacuatlayotl: the vessel, the turtle. Who knows if Sahuayo was ever called that, son.",
"Ellos decidieron que sí. Y le rezaron al nombre como si fuera santo.": "They decided it was. And they prayed to the name as if it were a saint.",
"Padre, con todo respeto, eso suena a...": "Father, with all due respect, that sounds like...",
"A locura. Sí. Hasta que la noche del 24 sonaron todas las campanas solas. Todas. Y la gente salió a la calle y ya no volvió a entrar.": "Madness. Yes. Until the night of the 24th, when every bell rang on its own. Every one. And people went out into the street and never came back in.",
"El sábado no amaneció, Liobas. Mira el reloj de la torre: da la hora como si nada. El cielo no.": "Saturday never dawned, Liobas. Look at the tower clock: it keeps the time like nothing's wrong. The sky doesn't.",
"Yo me encerré aquí con Lupe. Lupe ya no está.": "I locked myself in here with Lupe. Lupe is gone.",
"...Lo siento.": "...I'm sorry.",
"Desde que cavaron, el 2 de julio, llevo escribiendo lo que sé en esta libreta. Toma la llave del baptisterio: ahí escondí una hoja que no quiero que lean ellos. Léela y vuelve.": "Since they started digging, on July 2, I've been writing what I know in this notebook. Take the baptistery key: I hid a page in there that I don't want them reading. Read it and come back.",
"¿Ya la leíste? Entonces ya sabes lo que yo: no es un exorcismo, hijo. Es una lista de nombres.": "You read it? Then you know what I know: it's not an exorcism, son. It's a list of names.",
"Las catacumbas llegan al Sagrado Corazón. Ahí están las campanas grandes. Si las toco, vienen todos. Y entonces los bendigo desde la torre. Es la única forma de alcanzarlos a todos.": "The catacombs reach the Sagrado Corazón. The big bells are there. If I ring them, they all come. And then I bless them from the tower. It's the only way to reach them all.",
"¿Y si no funciona?": "And if it doesn't work?",
"Entonces corres, hijo. Yo ya estoy viejo. La trampilla de la sacristía: ya la abrí. Nos vemos arriba.": "Then you run, son. I'm old already. The trapdoor in the sacristy: I've opened it. See you up there.",
"Ve al baptisterio primero. La llave ya la tienes.": "Go to the baptistery first. You already have the key.",
"Nos vemos arriba, hijo. Ve con Dios. O con quien sea que quede.": "See you up there, son. Go with God. Or with whoever's left.",
"Una señora con una veladora apagada. No me ve a mí: ve la puerta de Sahagún.": "A woman with an unlit candle. She's not looking at me: she's looking at the Sahagún door.",
"Pide prender la veladora de su hijo en la puerta lateral. Cuando esté prendida, vuelve con ella.": "She asks you to light her son's candle at the side door. When it's lit, come back to her.",
"Ya quedó, señora. Ya está prendida.": "It's done, señora. It's lit.",
"La señora señala el altar de la Parroquia y se va con la niebla. Detrás del altar hay algo.": "The woman points at the church altar and drifts away with the fog. There's something behind the altar.",
"Pa abajo, pues. Como el niño.": "Down we go, then. Like the boy.",
"Tabique, nichos, placas con nombres. Y veladoras nuevas. Aquí anduvieron hace poco.": "Brick, niches, plaques with names. And new candles. They were here not long ago.",
"Está oscuro. La radio chasquea sin parar aquí abajo: puedes apagarla con T.": "It's dark. The radio crackles nonstop down here: you can turn it off with T.",
"Suenan antes de verse. Como el traje de los danzantes, pero despacio.": "You hear them before you see them. Like the dancers' costumes, but slow.",
"¿Qué... ? Una máscara de tlahualil. Pegada. Pegada a la cara.": "What...? A tlahualil mask. Stuck. Stuck to the face.",
"Es de tlahualil... pero alguien le hizo algo. Le quitaron los colores y le taparon los ojos con cera.": "It's a tlahualil mask... but someone did something to it. They stripped the colors and sealed the eyes with wax.",
"Corre más rápido que yo. No le voy a dar con nada. Mejor no hacer ruido.": "It runs faster than me. Nothing I've got will hurt it. Better not make noise.",
"Un señor sentado en su nicho, con sombrero. Sin rifle. Me enseña las manos vacías.": "A man sitting in his niche, with a hat. No rifle. He shows me his empty hands.",
"Tenga, don. Ya está.": "Here, don. There you go.",
"El Cristero se acomoda el sombrero y golpea la pared con la culata. El tabique cede: hay un atajo.": "The Cristero straightens his hat and strikes the wall with the rifle butt. The brick gives way: there's a shortcut.",
"Candado de cuatro números. \"El año en que se cerró\". El Padre dijo: el del niño.": "A four-digit lock. \"The year it was closed\". The Father said: the boy's year.",
"Mil novecientos veintiocho. Abrió.": "Nineteen twenty-eight. It opened.",
"El Sagrado Corazón. La nave enorme, las flores secas. Y el piano del coro con la tapa abierta.": "The Sagrado Corazón. The enormous nave, the dried flowers. And the choir piano with its lid open.",
"(una tecla) ...Perdón.": "(one key) ...Sorry.",
"Cuatro pisos de caracol. Por las ventanas, el pueblo en niebla, y por todas las calles gente caminando pa acá. Despacio.": "Four floors of spiral stairs. Through the windows, the town in fog, and down every street people walking this way. Slowly.",
"Las ocho y media. Y sigue siendo de noche.": "Half past eight. And it's still night.",
"La cuerda de las campanas. Jala tres veces (E).": "The bell rope. Pull three times (E).",
"Una.": "One.",
"Dos.": "Two.",
"Tres.": "Three.",
"(desde abajo, subiendo) ¡Ya vienen! ¡Por Madero, por Hidalgo, por Monterde! ¡Todos!": "(from below, climbing) They're coming! Down Madero, down Hidalgo, down Monterde! All of them!",
"(gritando por la ventana) ¡EN EL NOMBRE DEL PADRE, DEL HIJO...!": "(shouting out the window) IN THE NAME OF THE FATHER, THE SON...!",
"...No pasa nada, Padre.": "...Nothing's happening, Father.",
"...No. Sí pasa. Todos levantaron la cara. Y las campanas siguen solas. Más fuerte.": "...No. Something is. They all raised their heads. And the bells keep ringing on their own. Louder.",
"Toma la libreta. Vete por Arregui, al arroyo. Hay una entrada vieja. Léela allá arriba, no aquí. ¡Corre, hijo!": "Take the notebook. Go down Arregui, to the creek. There's an old entrance. Read it up there, not here. Run, son!",
"El Campanero. Está subiendo.": "The Bell-Ringer. He's coming up.",
"¡No lo puedo tumbar! ¡Corre!": "I can't knock him down! Run!",
"Arregui. El Padre dijo al arroyo.": "Arregui. The Father said the creek.",
"Talleres de huarache, hormas colgadas. Y una troca con el motor prendido, sin nadie.": "Huarache workshops, lasts hanging. And a pickup with the engine running, nobody in it.",
"El Infiernito. Qué nombre pa un arroyo. Qué nombre pa esta noche.": "El Infiernito. The little hell. What a name for a creek. What a name for tonight.",
"Una niña parada en el agua. Con una muñeca sin cabeza. No me ve.": "A girl standing in the water. With a headless doll. She doesn't see me.",
"Ten. Ya está completa.": "Here. She's whole now.",
"La niña abraza la muñeca y señala el talud: una boca de piedra con una cruz de hierro oxidada. Luego se hunde en el agua, despacio, sin una burbuja.": "The girl hugs the doll and points at the bank: a stone mouth with a rusted iron cross. Then she sinks into the water, slowly, without a bubble.",
"Roca, goteo, y luego tabique viejo. Las catacumbas de abajo de las catacumbas.": "Rock, dripping, and then old brick. The catacombs beneath the catacombs.",
"Esto no sale en las visitas de las catacumbas. Esto no lo sabe nadie.": "This isn't on the catacomb tour. Nobody knows about this.",
"Una veladora grande, con cerillos. Alguien la dejó aquí a propósito.": "A big candle, with matches. Someone left it here on purpose.",
"V: prender o apagar la veladora. Los Enmascarados no cruzan su luz. Si corres, se apaga.": "V: light or snuff the candle. The Masked Ones won't cross its light. If you run, it goes out.",
"(la radio, apagada, chasquea) ...está tibia.": "(the radio, switched off, crackles) ...it's warm.",
"Ahí está. La vasija. La tortuga. Está tibia.": "There it is. The vessel. The turtle. It's warm.",
"...Eso lo dije yo. Todavía no lo decía.": "...That was me saying that. I hadn't said it yet.",
"Duermen alrededor. Todos con la máscara. Si corro, despiertan. Despacio.": "They're sleeping all around it. All wearing the mask. If I run, they wake up. Slowly.",
"¡Despertaron!": "They're awake!",
"Ciento cuarenta escalones, dijo la libreta. Pa arriba.": "A hundred and forty steps, the notebook said. Up we go.",
"Página 1. La cosa de abajo no es demonio ni es santo. Es el lugar. Es el nombre. Despierta cuando lo llaman y se duerme cuando lo dejan en paz.": "Page 1. The thing below is neither demon nor saint. It is the place. It is the name. It wakes when it's called and sleeps when it's left alone.",
"Página 2. Los poseídos responden a su propio nombre. Lupe me volteó a ver cuando le dije \"Lupe\". Un segundo. Luego se fue.": "Page 2. The possessed answer to their own names. Lupe turned to look at me when I said \"Lupe\". One second. Then she was gone.",
"Página 4. Súbete donde te oigan todos. Toca para que vengan. Y luego no les reces: nómbralos. Uno por uno. Hasta que se cansen de estar despiertos.": "Page 4. Get up somewhere they can all hear you. Ring so they come. And then don't pray at them: name them. One by one. Until they get tired of being awake.",
"Cristo Rey. La explanada, el pedestal, las bocinas apuntando al pueblo. Y abajo, en la niebla, todas las campanas.": "Cristo Rey. The esplanade, the pedestal, the speakers pointed at the town. And below, in the fog, every bell.",
"El generador. Sin gasolina. Había un bidón por las jardineras.": "The generator. Out of gas. There was a can by the planters.",
"Arrancó a la segunda. Mejor que el Tsuru.": "Started on the second try. Better than the Tsuru.",
"La campana chica de la capilla. Tres veces (E).": "The chapel's small bell. Three times (E).",
"Ya vienen. Por la escalinata, despacio. Al micrófono.": "They're coming. Up the stairway, slowly. To the microphone.",
"Probando... Sahuayo. Soy Liobas, el de doña Chuy. Me fui hace quince años. Ya volví.": "Testing... Sahuayo. This is Liobas, doña Chuy's boy. I left fifteen years ago. I'm back.",
"No les voy a rezar. Les voy a pasar lista.": "I'm not going to pray at you. I'm going to call the roll.",
"...Una campana se calló.": "...One bell went quiet.",
"Ese no es de aquí. Ese es el nombre de la cosa. Suben más rápido.": "That one's not from here. That's the thing's name. They're climbing faster.",
"Silencio.": "Silence.",
"La gente sube las escaleras despacio. Se sienta en los escalones. Se duerme. La Hermandad, sin campanas, se queda parada en la explanada sin saber qué hacer.": "The people climb the stairs slowly. They sit on the steps. They fall asleep. The Brotherhood, with no bells, stands on the esplanade not knowing what to do.",
"Amanece sobre la Ciénega. Por fin. Una luz se prende abajo: primero en el llano, luego en los tejados. Al revés.": "Dawn over the Ciénega. At last. A light comes on below: first on the plain, then on the rooftops. Backwards.",
"Despierta, Sahuayo.": "Wake up, Sahuayo.",
"Los Enmascarados llegaron a la explanada.": "The Masked Ones reached the esplanade.",
"LA PROCESION DE LOS DORMIDOS\n\nSHY Studios · 2019-2026\nCalles reales: OpenStreetMap (ODbL). Personajes y hechos: ficción. La Hermandad, la vasija y lo que hay debajo de Sahuayo son invención.\nAudio y gráficos sintetizados. Gracias por volver.": "LA PROCESION DE LOS DORMIDOS\n\nayotl.dev · 2019-2026\nReal streets: OpenStreetMap (ODbL). People and events: fiction. The Brotherhood, the vessel and what lies beneath Sahuayo are invented.\nSynthesized audio and graphics. Thanks for coming back.",

"Es domingo, son las cuatro y media. ¿Qué esperaba? ¿Mariachi?": "日曜の朝四時半だぞ。何を期待してた？マリアッチか？",
"Vendieron la casa de mi mamá. Vengo por las cajas y me regreso.": "母さんの家が売れた。荷物を取りに来ただけだ。すぐ帰る。",
"...¿Y ese? Parado en el acotamiento, viendo el llano. Ni voltea.": "…あいつは何だ？路肩に突っ立って、平野を見てる。振り向きもしない。",
"...Pinche borracho.": "…酔っ払いめ。",
"Niebla. La de la ciénega. Mi mamá decía que cuando baja así, no sale nadie.": "霧だ。湿地の霧。こんなふうに降りてくる夜は誰も外に出ないって、母さんが言ってた。",

"Ni un taxi, ni un alma. Camina por el boulevard hacia el norte, hasta la calle Constitución.": "タクシーも人影もない。大通りを北へ、コンスティトゥシオン通りまで歩け。",
"Algo anda mal con ese señor. Defiéndete: clic o F para golpear. Cuida el aire.": "あの男は様子がおかしい。身を守れ：クリックかFで殴る。息に気をつけろ。",
"Busca a algún policía en la Presidencia Municipal. La entrada principal está encadenada: prueba la puerta de la calle Guerrero.": "市役所で警官を探せ。正面入口は鎖で閉まっている：ゲレロ通り側の扉を試せ。",
"Hay guardias adentro y no están bien. Busca algo con qué defenderte en las oficinas.": "中に警備員がいるが、まともじゃない。事務室で武器になる物を探せ。",
"Sube a la planta alta: Seguridad Pública y la oficina del Presidente.": "二階へ上がれ：公安課と市長室だ。",
"Lee lo que dejaron en el Cabildo y en la oficina del Presidente.": "議会室と市長室に残された物を読め。",
"Ya sabes lo suficiente. Sal por la puerta de Guerrero y toma Constitución hacia la plaza.": "もう十分わかった。ゲレロ通りの扉から出て、コンスティトゥシオン通りを広場へ。",
"Toma Constitución hacia el poniente. Los cruces están cerrados con carros; sigue la calle hasta el Hotel Latino.": "コンスティトゥシオン通りを西へ。交差点は車でふさがれている。ホテル・ラティーノまで進め。",
"El cencerro suena desde la azotea del Hotel Latino. Entra: la llave del 7 está en el tablero de la recepción.": "ホテル・ラティーノの屋上からカウベルが鳴っている。中へ：7号室の鍵はフロントのキーボードにある。",
"Los perros se dispersaron. Sigue por Constitución hasta la Farmacia Roma: ahí hay medicinas, debajo del mostrador.": "犬たちは散った。コンスティトゥシオン通りを薬局ロマまで。カウンターの下に薬がある。",
"Llega a la Plaza Principal, al kiosco.": "中央広場の東屋まで行け。",
"La Parroquia está encadenada. Rodea por el Mercado: entra por la calle Morelos, al sur.": "教会は鎖で閉まっている。市場を回り込め：南のモレロス通りから入れ。",
"Entra al Mercado por la puerta de Morelos (al sur de la Parroquia) y cruza hasta la reja de Sahagún.": "モレロス通り側の入口（教会の南）から市場に入り、サアグン通り側の鉄格子まで抜けろ。",
"La puerta lateral de la Parroquia da a Sahagún. Entra.": "教会の横の扉はサアグン通りに面している。入れ。",
"Alguien se atrincheró en las oficinas del patio. Habla con quien esté ahí.": "中庭の事務室に誰かが立てこもっている。話しかけろ。",
"El Padre te dio la llave del baptisterio. Ahí guardó lo que no quería que la Hermandad leyera.": "神父に洗礼堂の鍵をもらった。兄弟団に読まれたくない物をそこに隠してある。",
"Vuelve con el Padre. La trampilla de la sacristía baja a las catacumbas.": "神父のところへ戻れ。聖具室の跳ね戸がカタコンベへ下りている。",
"Las galerías llegan al Sagrado Corazón. Busca la capilla subterránea: ahí dejaron su cuaderno.": "通路はサグラド・コラソン教会まで続いている。地下の礼拝堂を探せ：奴らのノートがある。",
"La escalera de salida tiene un candado de cuatro números. Alguna placa de estos nichos sabe el año.": "出口の階段には四桁の錠がかかっている。この壁龕の銘板のどれかがその年を知っている。",
"Sube al Sagrado Corazón.": "サグラド・コラソン教会へ上がれ。",
"Sube a la torre. Las campanas grandes están arriba: el Padre quiere que las toques.": "塔を登れ。大きな鐘は上にある：神父はお前に鳴らしてほしがっている。",
"No funcionó. El Campanero sube. Baja la torre, cruza la nave y sal por el atrio hacia el norte, a la calle Arregui.": "だめだった。鐘つきが上がってくる。塔を下り、身廊を抜け、前庭から北のアレギ通りへ出ろ。",
"Baja por Arregui hasta el arroyo. El Padre dijo \"una entrada vieja\" en el talud.": "アレギ通りを下って小川へ。神父は土手に「古い入口」があると言った。",
"La niña del río no habla. Le falta algo a su muñeca. La troca con el motor encendido tiene la puerta abierta.": "川の少女は話さない。人形に何かが足りない。エンジンのかかったピックアップのドアが開いている。",
"La boca de piedra con la cruz de hierro. Entra.": "鉄の十字架のある石の口。入れ。",
"Cruza la cueva. Los Enmascarados no cruzan la luz de una veladora: si encuentras una, prendela (V).": "洞窟を抜けろ。仮面の者たちはろうそくの光を越えられない：見つけたら灯せ（V）。",
"La sala del Ayotl. Duermen alrededor. No corras. No dispares. Cruza.": "アヨトルの間。奴らが周りで眠っている。走るな。撃つな。渡れ。",
"La escalera de piedra. Sube. Lee la libreta mientras subes.": "石の階段。登れ。登りながら手帳を読め。",
"El sistema de audio del cerro necesita luz. Hay un generador en el cuarto de máquinas, bajo la explanada, lado poniente. Le falta gasolina.": "丘の音響設備には電気がいる。広場の下、西側の機械室に発電機がある。ガソリンが足りない。",
"Toca la campana chica de la capilla tres veces, para que vengan.": "礼拝堂の小さな鐘を三度鳴らせ。奴らが来るように。",
"Al micrófono. No les reces: nómbralos. Uno por uno. Tres rondas.": "マイクへ。祈るな：名前を呼べ。一人ずつ。三回戦だ。",
